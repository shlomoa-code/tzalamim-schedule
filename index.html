<title>סידור עבודה — צלמים ומקליטים</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{
  --blue:#1A6FBF; --blue-bg:#E6F1FB;
  --green:#0F6E56; --green-bg:#E1F5EE;
  --amber:#C47A00; --amber-bg:#FAEEDA;
  --red:#A32D2D; --red-bg:#FCEBEB;
  --ink:#1F2430; --muted:#6B7280; --line:#E4E4E7; --bg:#FAFAF9;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);padding:16px;font-size:14px}
.wrap{max-width:1400px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px}
h1{font-size:19px;font-weight:600}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.btn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13px;color:var(--ink);transition:.15s}
.btn:hover{background:#F2F2F0}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-primary:hover{background:#155a99}
.btn-danger{background:#fff;color:var(--red);border-color:#E8B4B4}
.btn-danger:hover{background:var(--red-bg)}
.btn-sm{padding:4px 9px;font-size:12px;border-radius:6px}
.week-nav{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.week-label{font-size:13px;font-weight:600;min-width:150px;text-align:center;direction:ltr}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tab{padding:9px 14px;font-size:13px;color:var(--muted);cursor:pointer;background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.sync-badge{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.dot-status{width:7px;height:7px;border-radius:50%;background:#22c55e;display:inline-block}
.dot-status.err{background:var(--red)}

.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
@media(max-width:1000px){.days-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:640px){.days-grid{grid-template-columns:repeat(2,1fr)}}
.day-col{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px;min-height:80px}
.day-head{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.day-head .dnum{color:var(--muted);font-weight:400;font-size:11px;direction:ltr}
.shift-card{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;position:relative}
.shift-time{font-size:11px;color:var(--muted);display:flex;gap:4px;align-items:center;margin-bottom:5px;direction:ltr;justify-content:flex-end}
.shift-time input{border:1px solid transparent;background:transparent;font-size:11px;color:var(--muted);width:44px;text-align:center;border-radius:4px;padding:1px}
.shift-time input:hover{border-color:var(--line)}
.shift-label{font-size:11px;font-weight:600;color:var(--ink);border:1px solid transparent;background:transparent;width:100%;border-radius:4px;margin-bottom:5px}
.shift-note-input{font-size:11px;font-weight:400;color:var(--muted);border:1px dashed var(--line);background:transparent;width:100%;border-radius:4px;margin-bottom:5px;padding:2px 4px}
.shift-note-input:focus{color:var(--ink);border-style:solid}
.shift-note{color:var(--amber);font-weight:700;font-size:10px;margin-bottom:4px}
.shift-label:hover,.shift-label:focus{border-color:var(--line);outline:none}
.worker-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:20px;font-size:12.5px;font-weight:500;cursor:pointer;width:100%;justify-content:center}
.worker-pill.empty{background:#fff;border:1px dashed var(--line);color:var(--muted)}
.worker-pill.filled{background:var(--blue-bg);color:var(--blue)}
.worker-pill.freelance{background:var(--red-bg);color:var(--red)}
.del-row{position:absolute;top:5px;left:5px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;opacity:.5;padding:2px}
.del-row:hover{opacity:1;color:var(--red)}
.sick-badge{display:flex;align-items:center;justify-content:space-between;background:#F1E6FB;color:#6D28D9;border-radius:6px;padding:4px 7px;font-size:11px;font-weight:600;margin-bottom:5px}
.prev-shoot-hint{background:#EEF5FC;color:#1A6FBF;border-radius:6px;padding:5px 7px;font-size:11px;margin-top:4px;line-height:1.4}
.sick-badge button{background:none;border:none;color:#6D28D9;cursor:pointer;font-size:12px;opacity:.7}
.sick-badge button:hover{opacity:1}
.freelance-input{width:100%;border:1px dashed var(--line);background:#fff;border-radius:6px;padding:5px 7px;font-size:11px;margin-top:5px}
.mark-sick-btn{width:100%;margin-top:5px;font-size:11px;padding:4px}

async function syncServerTime(){

    const serverDateHeader = res.headers.get('date');
    if(serverDateHeader){

      serverTimeOffsetMs = serverTime - Date.now();

  }catch(e){ console.error('server time sync failed', e); }

function dateStr(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fmtDateShort(isoString){
  if(!isoString) return '';
  const d = new Date(isoString);
  if(isNaN(d.getTime())) return '';
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}
function shiftDateStr(baseDateStr, days){
  const dt = new Date(baseDateStr);
  dt.setDate(dt.getDate() + days);
  return dateStr(dt);
}
function getWeekStart(offset){
  const now = new Date();
  const day = now.getDay(); // 0=Sun
  const sunday = new Date(now); sunday.setDate(now.getDate()-day+offset*7);
  sunday.setHours(0,0,0,0);
  return sunday;
}
function fmtWeekLabel(sunday){
  const sat = new Date(sunday); sat.setDate(sunday.getDate()+6);
  const f = d => `${d.getDate()}/${d.getMonth()+1}`;
  return `${f(sunday)} — ${f(sat)}`;
}
function dateForDay(dayIndex){
  const d = new Date(weekStart); d.setDate(d.getDate()+dayIndex);
  return dateStr(d);
}

async function refreshAll(){
  const constraintsWeekStart = dateStr(getWeekStart(constraintsWeekOffset));
  const [w, s, m, t, c, vAll, f, mv, dr, vw, swc, wp, tlAll] = await Promise.all([
    sb.from('workers').select('*').order('name'),
    sb.from('shifts').select('*').eq('week_start', weekStart).order('row_order'),
    sb.from('magazine_teams').select('*').eq('week_start', weekStart).order('row_order'),
    sb.from('topline_notes').select('*').eq('week_start', weekStart),
    sb.from('constraints').select('*').eq('week_start', constraintsWeekStart),
    fetchAllRows('vacation_requests', '*'),
    sb.from('freelancers').select('*').order('name'),
    sb.from('mivtzaim_notes').select('*').eq('week_start', weekStart),
    sb.from('duty_roster').select('*').order('duty_date'),
    sb.from('viewers').select('*').order('name'),
    sb.from('constraints').select('*').eq('week_start', weekStart),
    sb.from('week_publish').select('published').eq('week_start', weekStart),
    fetchAllRows('topline_log', '*')
  ]);
  workers = w.data || [];
  shifts = s.data || [];
  magTeams = m.data || [];
  toplineNotes = t.data || [];
  constraintsData = c.data || [];
  vacationRequests = (vAll || []).sort((a,b)=>(a.from_date||'').localeCompare(b.from_date||''));
  freelancers = f.data || [];
  mivtzaimNotes = mv.data || [];
  dutyRoster = dr.data || [];
  viewers = vw.data || [];
  scheduleWeekConstraints = swc.data || [];
  toplineLog = (tlAll || []).sort((a,b)=>(b.log_date||'').localeCompare(a.log_date||''));
  if(wp.error || !wp.data || !wp.data.length){
    const isFutureWeek = weekStart > dateStr(getWeekStart(0));
    weekPublished = !isFutureWeek; // שבועות עתידיים שעדיין לא פורסמו במפורש - מוסתרים כברירת מחדל. שבועות נוכחיים/עבר - גלויים כרגיל.
  } else {
    weekPublished = !!wp.data[0].published;
  }
  if(!workers.length) await seedWorkers();
  else await backfillWorkerEmails();
  await backfillFreelancers();
  if(!dutyRoster.length) await seedDutyRoster();
  if(!viewers.length) await seedViewers();
  updatePublishBtn();
  render();
}

async function ensureWeekInitialized(){
  const existingShifts = await sb.from('shifts').select('id').eq('week_start', weekStart).limit(1);
  if(!existingShifts.data || existingShifts.data.length===0){
    const rows = [];
    for(const [key,region] of Object.entries(REGIONS)){
      region.weekdayDays.forEach(dayIdx=>{
        region.weekday.forEach((tpl,idx)=>{
          rows.push({week_start:weekStart, region:key, day_of_week:dayIdx, label:tpl.label, start_time:tpl.start, end_time:tpl.end, worker_id:null, row_order:idx});
        });
      });
      region.weekendDays.forEach(dayIdx=>{
        region.weekend.forEach((tpl,idx)=>{
          rows.push({week_start:weekStart, region:key, day_of_week:dayIdx, label:tpl.label, start_time:tpl.start, end_time:tpl.end, worker_id:null, row_order:idx});
        });
      });
    }
    if(rows.length) await sb.from('shifts').insert(rows);
  }

  const existingTeams = await sb.from('magazine_teams').select('id').eq('week_start', weekStart).limit(1);
  if(!existingTeams.data || existingTeams.data.length===0){
    const rows = [];
    for(const [key,mag] of Object.entries(MAGAZINES)){
      mag.days.forEach(dayIdx=>{
        for(let i=0;i<mag.perDay;i++){
          rows.push({week_start:weekStart, magazine:key, day_of_week:dayIdx, photographer_id:null, recorder_id:null, reporter_name:'', topic:'', area:'', start_time:'', end_time:'', row_order:i});
        }
      });
    }
    if(rows.length) await sb.from('magazine_teams').insert(rows);
  }

  await ensureOncallInitialized();
}

async function ensureOncallInitialized(){
  const existing = await sb.from('shifts').select('id,region,day_of_week').eq('week_start', weekStart).eq('label','כונן');
  const have = new Set((existing.data||[]).map(r=>`${r.region}-${r.day_of_week}`));
  const rows = [];
  for(const [region,cfg] of Object.entries(ONCALL)){
    cfg.days.forEach(dayIdx=>{
      if(!have.has(`${region}-${dayIdx}`)){
        rows.push({week_start:weekStart, region, day_of_week:dayIdx, label:'כונן', start_time:cfg.start, end_time:cfg.end, worker_id:null, row_order:99});
      }
    });
  }
  if(rows.length) await sb.from('shifts').insert(rows);
}

      if(pw !== ADMIN_PASSWORD){ if(pw!==null) alert('סיסמה שגויה'); return; }

async function togglePublish(){
  const newVal = !weekPublished;
  await sb.from('week_publish').upsert({week_start:weekStart, published:newVal}, {onConflict:'week_start'});
  weekPublished = newVal;
  updatePublishBtn();
  render();
  if(newVal){
    const {data} = await sb.from('week_publish').select('notified').eq('week_start', weekStart).maybeSingle();
    const alreadyNotified = data && data.notified;
    if(!alreadyNotified){
      const sunday = getWeekStart(weekOffset);
      await sendPublishNotificationEmails(fmtWeekLabel(sunday));
      await sb.from('week_publish').update({notified:true}).eq('week_start', weekStart);
    }
  }
}
function updatePublishBtn(){
  const btn = document.getElementById('publish-toggle-btn');
  if(!btn) return;
  btn.style.display = editMode ? '' : 'none';
  if(weekPublished){
    btn.textContent = '✅ מפורסם (לחץ להסתרה כטיוטה)';
    btn.className = 'btn';
  } else {
    btn.textContent = '🚀 פרסם סידור השבוע';
    btn.className = 'btn btn-primary';
  }
}

  Array.from(el.querySelectorAll('.table-scroll')).forEach((e,i)=>{ if(prevInnerScrolls[i]!==undefined) e.scrollTop = prevInnerScrolls[i]; });

function splitLabelNote(label){
  if(!label) return {base:label||'', note:''};
  const m = label.match(/\(([^)]+)\)/);
  if(!m) return {base:label, note:''};
  const base = label.replace(m[0], '').trim();
  return {base, note:m[1]};
}

function shiftsFor(region, day, filterFn){
  return sortShiftsChrono(shifts.filter(s=>s.region===region && s.day_of_week===day && filterFn(s.label)));
}
function timeToMinutes(t){
  if(!t) return -1;
  const m = String(t).trim().match(/^(\d{1,2}):(\d{2})/);
  if(!m) return -1;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}
function sortShiftsChrono(list){
  return [...list].sort((a,b)=>{
    const aPinned = a.row_order>=90, bPinned = b.row_order>=90;
    if(aPinned !== bPinned) return aPinned ? 1 : -1;
    if(aPinned && bPinned) return a.row_order - b.row_order;
    return timeToMinutes(a.start_time) - timeToMinutes(b.start_time);
  });
}
function regionCellInner(region, day, filterFn, defaultLabel){

function renderAbsenceSummary(){
  const sunday = getWeekStart(weekOffset);
  const weekStartStr = dateStr(sunday);
  const sat = new Date(sunday); sat.setDate(sunday.getDate()+6);
  const weekEndStr = dateStr(sat);

  const sickEntries = [];
  shifts.forEach(s=>{
    if(s.sick_worker_id){ sickEntries.push({name:workerName(s.sick_worker_id), day:DAYS[s.day_of_week].label, context:s.label}); }
    if(s.sick_recorder_id){ sickEntries.push({name:workerName(s.sick_recorder_id), day:DAYS[s.day_of_week].label, context:s.label}); }
  });
  magTeams.forEach(t=>{
    if(t.sick_photographer_id){ sickEntries.push({name:workerName(t.sick_photographer_id), day:DAYS[t.day_of_week].label, context:MAGAZINES[t.magazine]?.name||t.magazine}); }
    if(t.sick_recorder_id){ sickEntries.push({name:workerName(t.sick_recorder_id), day:DAYS[t.day_of_week].label, context:MAGAZINES[t.magazine]?.name||t.magazine}); }
  });
  // אילוצים שהוצהרו כ"מחלה" או "יום תמורה" עבור השבוע המוצג כרגע בסידור (ללא תלות בניווט בטאב האילוצים)
  const compEntries = [];
  {
    scheduleWeekConstraints.forEach(c=>{
      if(c.status==='sick'){
        const name = workerName(c.worker_id);
        const day = DAYS[c.day_of_week].label;
        const exists = sickEntries.some(e=>e.name===name && e.day===day);
        if(!exists) sickEntries.push({name, day, context:'אילוץ מוצהר'});
      }
      if(c.status==='comp_day'){
        compEntries.push({name:workerName(c.worker_id), day:DAYS[c.day_of_week].label});
      }
    });
  }

  const approvedThisWeek = vacationRequests.filter(v=>v.status==='approved' && v.from_date<=weekEndStr && v.to_date>=weekStartStr);
  const vacationEntries = approvedThisWeek.filter(v=>v.req_type!=='sick')
    .map(v=>({name:workerName(v.worker_id), from:v.from_date, to:v.to_date}));
  approvedThisWeek.filter(v=>v.req_type==='sick').forEach(v=>{
    sickEntries.push({name:workerName(v.worker_id), day:`${v.from_date}${v.from_date!==v.to_date?' עד '+v.to_date:''}`, context:'מחלה מתוכננת'});
  });

  if(!sickEntries.length && !vacationEntries.length && !compEntries.length) return '';

  let html = `<div class="absence-summary">`;
  if(sickEntries.length){
    html += `<div class="absence-col"><h4>🤒 במחלה השבוע</h4>` +
      sickEntries.map(e=>`<div class="absence-row">${e.name} — ${e.day} (${e.context})</div>`).join('') + `</div>`;
  }
  if(vacationEntries.length){
    html += `<div class="absence-col"><h4>🏖️ בחופש השבוע</h4>` +
      vacationEntries.map(e=>`<div class="absence-row">${e.name} — ${e.from}${e.from!==e.to?' עד '+e.to:''}</div>`).join('') + `</div>`;
  }
  if(compEntries.length){
    html += `<div class="absence-col"><h4>🔁 יום תמורה מבוקש</h4>` +
      compEntries.map(e=>`<div class="absence-row">${e.name} — ${e.day}</div>`).join('') + `</div>`;
  }
  html += `</div>`;
  return html;
}

/* ---------- מצא את המשמרות שלי (תצוגה אישית לנייד) ---------- */
function getMyShiftEntries(id){
  const entries = [];
  shifts.forEach(s=>{
    const partnerLabel = (workerId, freelanceName) => {
      if(freelanceName && freelanceName!=='?') return freelanceLabel(freelanceName);
      return workerId ? (workerName(workerId)||'') : '';
    };
    if(s.worker_id===id){
      const partner = partnerLabel(s.recorder_id, s.freelance_recorder_name);
      entries.push({day:s.day_of_week, cat:REGIONS[s.region]?.name||s.region, label:s.label, start_time:s.start_time, end_time:s.end_time, time:`${s.start_time}–${s.end_time}`, role:'צלם', partner: partner?`מקליט: ${partner}`:'', colorClass: s.label==='כונן'?'oncall':''});
    }
    if(s.recorder_id===id){
      const partner = partnerLabel(s.worker_id, s.freelance_name);
      entries.push({day:s.day_of_week, cat:REGIONS[s.region]?.name||s.region, label:s.label, start_time:s.start_time, end_time:s.end_time, time:`${s.start_time}–${s.end_time}`, role:'מקליט', partner: partner?`צלם: ${partner}`:'', colorClass: s.label==='כונן'?'oncall':''});
    }
  });
  magTeams.forEach(t=>{
    const partnerLabelMag = (workerId, freelanceName) => {
      if(freelanceName && freelanceName!=='?') return freelanceLabel(freelanceName);
      return workerId ? (workerName(workerId)||'') : '';
    };
    const extra = [t.reporter_name?`כתב: ${t.reporter_name}`:'', t.topic?`נושא: ${t.topic}`:''].filter(Boolean).join(' · ');
    const magColorClass = t.magazine ? `mag-${t.magazine}` : '';
    if(t.photographer_id===id){
      const partner = partnerLabelMag(t.recorder_id, t.freelance_recorder_name);
      entries.push({day:t.day_of_week, cat:MAGAZINES[t.magazine]?.name||t.magazine, label:extra, start_time:t.start_time, end_time:t.end_time, time:t.start_time?`${t.start_time}–${t.end_time}`:'', role:'צלם', partner: partner?`מקליט: ${partner}`:'', colorClass: magColorClass});
    }
    if(t.recorder_id===id){
      const partner = partnerLabelMag(t.photographer_id, t.freelance_photographer_name);
      entries.push({day:t.day_of_week, cat:MAGAZINES[t.magazine]?.name||t.magazine, label:extra, start_time:t.start_time, end_time:t.end_time, time:t.start_time?`${t.start_time}–${t.end_time}`:'', role:'מקליט', partner: partner?`צלם: ${partner}`:'', colorClass: magColorClass});
    }
  });
  entries.sort((a,b)=>a.day-b.day);
  return entries;
}

  }

    return renderMaHeader(myId,'') + `<div style="padding:0 4px">

        <div class="ma-week-btn ${weekOffset===1?'active':''}" onclick="weekOffset=1;loadWeek()">שבוע הבא</div>

    </div>`;
  }
  const entries = getMyShiftEntries(myId);
  const todayIdx = new Date().getDay();
  const nowMinutes = new Date().getHours()*60 + new Date().getMinutes();
  let nextEntry = null;
  const sorted = [...entries].sort((a,b)=>a.day-b.day);
  for(const e of sorted){
    if(e.day > todayIdx){ nextEntry = e; break; }

      const endM = timeToMinutes(e.end_time);
      if(endM < 0 || endM > nowMinutes){ nextEntry = e; break; }

  }

  const weekNav = `<div class="ma-week-nav">

    return `<div class="ma-card ${isToday?'today':''}">
      <div class="ma-card-top">
        <span class="ma-card-day">${DAYS[e.day].label}</span>

  return renderMaHeader(myId, heroHtml) + `<div style="padding:0 4px">

async function submitMaVacation(){

function htmlToPlainText(html){
  const withBreaks = String(html||'').replace(/<\/(div|tr|p)>/gi, '\n').replace(/<br\s*\/?>/gi, '\n');
  const tmp = document.createElement('div');
  tmp.innerHTML = withBreaks;
  const text = tmp.textContent || '';
  return text.split('\n').map(l=>l.trim()).filter(Boolean).join(' | ');
}
function shiftCellHtml(s){
  if(!s) return '';
  let name, isFreelance=false;
  if(s.sick_worker_id){
    name = `🤒 ${workerName(s.sick_worker_id)||''} (מוחלף)`;
  } else if(s.freelance_name==='?'){
    name = '❓ טרם שובץ';
  } else if(s.freelance_name){
    name = s.freelance_name; isFreelance = true;
  } else {
    name = workerName(s.worker_id) || '';
  }
  let extra = '';
  if(s.recorder_id || (s.freelance_recorder_name && s.freelance_recorder_name!=='?')){
    const rn = (s.freelance_recorder_name && s.freelance_recorder_name!=='?') ? s.freelance_recorder_name : (workerName(s.recorder_id)||'');
    if(rn) extra = ` + ${rn}`;
  }
  const timePart = (s.start_time || s.end_time) ? `${s.start_time||''}-${s.end_time||''}` : '';
  if(!name && !timePart) return '';
  const nameColor = isFreelance ? 'color:#B71C1C;' : '';
  return `<div style="font-weight:700;font-size:13px;${nameColor}">${name}${extra}</div>${timePart?`<div style="color:#555;font-size:12px;margin-top:2px;font-weight:normal">${timePart}</div>`:''}`;
}
function excelTd(content, opts){
  opts = opts || {};
  const bg = opts.bg || '#FFFFFF';
  const bold = opts.bold ? 'font-weight:bold;' : '';
  const extraStyle = opts.style || '';
  return `<td style="border:1px solid #999999;padding:4px 6px;text-align:center;vertical-align:middle;background:${bg};${bold}font-family:Arial,sans-serif;font-size:13px;line-height:1.2;${extraStyle}">${content||''}</td>`;
}
function exportRegionRowsHtml(regionKey, groupLabel, filterFn, bgColor){
  const regionShifts = shifts.filter(s=>s.region===regionKey && filterFn(s.label));
  if(!regionShifts.length) return '';
  // לכל יום בנפרד ממיינים כרונולוגית (כמו בתצוגה הרגילה), ואז מציבים לפי מיקום (משמרת 1, 2, 3...)
  // כך שאם ימים שונים משתמשים בשמות משמרת שונים לאותו "סלוט", זה עדיין מיושר נכון בטבלה
  const byDay = {};
  DAYS.forEach(d=>{
    const dayShifts = sortShiftsChrono(regionShifts.filter(s=>s.day_of_week===d.i))
      .filter(s => s.worker_id || (s.freelance_name && s.freelance_name!=='') || s.start_time || s.end_time); // דלג על משמרות ריקות לגמרי (בלי עובד ובלי שעה)
    byDay[d.i] = dayShifts;
  });
  const maxRows = Math.max(0, ...DAYS.map(d=>byDay[d.i].length));
  if(maxRows===0) return '';
  let html = '';
  for(let pos=0; pos<maxRows; pos++){
    html += '<tr>';
    if(pos===0){
      html += `<td rowspan="${maxRows}" style="border:1px solid #999999;padding:8px;text-align:center;vertical-align:middle;background:#FFFFFF;font-weight:bold;font-family:Arial,sans-serif;font-size:13px">${groupLabel}</td>`;
    }
    DAYS.forEach(d=>{
      const s = byDay[d.i][pos];
      html += excelTd(shiftCellHtml(s), {bg:bgColor});
    });
    html += '</tr>';
  }
  return html;
}
function exportScheduleToExcel(){
  const sunday = getWeekStart(weekOffset);
  const headerBg = '#F5A83C';
  const COLORS = {
    ta: '#FBE0E3', jerusalem: '#E2F0FB', special: '#F0E6FB',
    south: '#E6F7EA', haifa: '#FEF6DC', mag: '#F1F1F1', topline: '#FDEBD3', mivtzaim: '#E0F5F2'
  };
  let body = '';

  body += exportRegionRowsHtml('ta', 'ת"א', l=>l!=='כונן', COLORS.ta);
  body += exportRegionRowsHtml('ta', 'כוננים ת"א', l=>l==='כונן', COLORS.ta);
  body += exportRegionRowsHtml('jerusalem', 'ירושלים', l=>l!=='כונן', COLORS.jerusalem);
  body += exportRegionRowsHtml('jerusalem', 'כוננים ירושלים', l=>l==='כונן', COLORS.jerusalem);
  if(shifts.some(s=>s.region==='special1')) body += exportRegionRowsHtml('special1', 'אירוע מיוחד 1', l=>true, COLORS.special);
  if(shifts.some(s=>s.region==='special2')) body += exportRegionRowsHtml('special2', 'אירוע מיוחד 2', l=>true, COLORS.special);
  body += exportRegionRowsHtml('south', 'דרום — צלם', l=>l!=='כונן' && l!=='ערבית', COLORS.south);
  body += exportRegionRowsHtml('south', 'כוננות דרום', l=>l==='כונן', COLORS.south);
  body += exportRegionRowsHtml('south', 'ערבית דרום', l=>l==='ערבית', COLORS.south);
  body += exportRegionRowsHtml('haifa', 'חיפה — צלם', l=>l!=='כונן' && l!=='ערבית', COLORS.haifa);
  body += exportRegionRowsHtml('haifa', 'כוננות חיפה', l=>l==='כונן', COLORS.haifa);
  body += exportRegionRowsHtml('haifa', 'ערבית חיפה', l=>l==='ערבית', COLORS.haifa);

  // מגזינים - כל פרט בשורה נפרדת בתוך התא, התא גדל כמה שצריך
  const magLabels = {mahadura:'מגזין מהדורה', rikuz:'מגזין ריכוז', friday:'מגזין שישי', saturday:'מגזין שבת'};
  Object.keys(magLabels).forEach(key=>{
    const teams = magTeams.filter(t=>t.magazine===key);
    if(!teams.length) return;
    const byDay = {};
    DAYS.forEach(d=>{ byDay[d.i] = teams.filter(t=>t.day_of_week===d.i).sort((a,b)=>a.row_order-b.row_order); });
    const maxRows = Math.max(0, ...DAYS.map(d=>byDay[d.i].length));
    for(let pos=0; pos<maxRows; pos++){
      body += '<tr>';
      if(pos===0){
        body += `<td rowspan="${maxRows}" style="border:1px solid #999999;padding:8px;text-align:center;vertical-align:middle;background:#FFFFFF;font-weight:bold;font-family:Arial,sans-serif;font-size:13px">${magLabels[key]}</td>`;
      }
      DAYS.forEach(d=>{
        const t = byDay[d.i][pos];
        if(!t){ body += excelTd('', {bg:COLORS.mag}); return; }
        const pName = (t.freelance_photographer_name && t.freelance_photographer_name!=='?') ? t.freelance_photographer_name : (workerName(t.photographer_id)||'');
        const rName = (t.freelance_recorder_name && t.freelance_recorder_name!=='?') ? t.freelance_recorder_name : (workerName(t.recorder_id)||'');
        const timePart = (t.start_time || t.end_time) ? `${t.start_time||''}-${t.end_time||''}` : '';
        const parts = [pName, rName, timePart].filter(Boolean);
        body += excelTd(parts.map(p=>`<div>${p}</div>`).join(''), {bg:COLORS.mag});
      });
      body += '</tr>';
    }
  });

  // טופליין
  if(toplineNotes.some(n=>n.note)){
    body += '<tr>' + excelTd('טופליין', {bold:true, bg:'#FFFFFF'});
    DAYS.forEach(d=>{
      const n = toplineNotes.find(x=>x.day_of_week===d.i);
      body += excelTd(n && n.note ? n.note : '', {bg:COLORS.topline});
    });
    body += '</tr>';
  }

  // מבצעים - כל שם בשורה נפרדת בתוך התא
  if(mivtzaimNotes.some(n=>n.note)){
    body += '<tr>' + excelTd('מבצעים', {bold:true, bg:'#FFFFFF'});
    DAYS.forEach(d=>{
      const n = mivtzaimNotes.find(x=>x.day_of_week===d.i);
      const names = n && n.note ? n.note.split('||').map(s=>s.trim()).filter(Boolean) : [];
      body += excelTd(names.map(nm=>`<div>${nm}</div>`).join(''), {bg:COLORS.mivtzaim});
    });
    body += '</tr>';
  }

  const headerRow = '<tr>' + excelTd('תאריך', {bold:true, bg:headerBg}) +
    DAYS.map(d=>excelTd(`<div>${d.label}</div><div style="font-weight:normal;font-size:11px">${dateForDay(d.i)}</div>`, {bold:true, bg:headerBg})).join('') + '</tr>';
  const titleRow = `<tr><td colspan="${DAYS.length+1}" style="text-align:center;font-weight:bold;font-size:16px;padding:10px;background:${headerBg};border:1px solid #999999;font-family:Arial,sans-serif">סידור עבודה — שבוע ${fmtWeekLabel(sunday)}</td></tr>`;

  const html = `<html dir="rtl"><head><meta charset="UTF-8"></head><body>
    <table style="border-collapse:collapse;width:100%">
      ${titleRow}
      ${headerRow}
      ${body}
    </table>
  </body></html>`;

  const blob = new Blob(['\ufeff' + html], {type:'application/vnd.ms-excel'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `סידור_שבועי_${weekStart}.xls`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

  return `${weekLine}

  ${body}
  ${accessRole==='producer' ? '' : renderAbsenceSummary()}`;
}

function renderRegion(regionKey){
  const region = REGIONS[regionKey];
  let html = `<div class="days-grid">`;
  DAYS.forEach(day=>{
    const isWeekend = day.i===5 || day.i===6;
    if(isWeekend && !region.weekendDays.includes(day.i) && !shifts.some(s=>s.region===regionKey && s.day_of_week===day.i)){
      html += `<div class="day-col"><div class="day-head">${day.label}<span class="dnum">${dateForDay(day.i).slice(8,10)}/${dateForDay(day.i).slice(5,7)}</span></div>`;

    }
    const dayShifts = sortShiftsChrono(shifts.filter(s=>s.region===regionKey && s.day_of_week===day.i));

          ? `<input class="shift-label" value="${s.label}" onchange="updateShift('${s.id}','label',this.value)">
             <div class="shift-time">
               <input value="${s.start_time}" onchange="updateShift('${s.id}','start_time',this.value)">–
               <input value="${s.end_time}" onchange="updateShift('${s.id}','end_time',this.value)">

        }

        ${editMode?`<input class="freelance-input" placeholder="או הקלד שם פרילנס" value="${s.freelance_name||''}" onchange="updateShift('${s.id}','freelance_name',this.value)">`:''}

    html += `</div>`;
  });
  html += `</div>`;
  return `<div class="mag-head"><div class="mag-title">${region.name}</div></div>` + html;

async function addShift(region, day, defaultLabel){
  let label;
  if(defaultLabel){
    label = prompt('שם המשמרת:', defaultLabel);
    if(label===null) return;
  } else {
    label = ''; // משמרת רגילה - בלי שם, רק שעות + שם עובד
  }
  const start = prompt('שעת התחלה:', '09:00') || '';
  const end = prompt('שעת סיום:', '18:00') || '';
  const maxOrder = Math.max(0, ...shifts.filter(s=>s.region===region && s.day_of_week===day && s.row_order<90).map(s=>s.row_order+1), 0);
  const {data} = await sb.from('shifts').insert({week_start:weekStart, region, day_of_week:day, label, start_time:start, end_time:end, worker_id:null, row_order:maxOrder}).select();
  if(data) shifts.push(data[0]);
  render();
}

async function exportFullBackup(){
  const btn = document.getElementById('backup-export-btn');
  const originalText = btn ? btn.textContent : '';
  if(btn){ btn.textContent = '💾 מכין גיבוי...'; btn.disabled = true; }
  try{
    const tables = ['workers','shifts','magazine_teams','duty_roster','vacation_requests','viewers','freelancers','week_publish','topline_log','topline_notes','mivtzaim_notes','constraints'];
    const backup = {exported_at: new Date().toISOString(), app: 'tzalamim-schedule'};
    for(const t of tables){
      backup[t] = await fetchAllRows(t, '*');
    }
    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateLabel = dateStr(new Date());
    a.href = url; a.download = `גיבוי-סידור-צלמים-${dateLabel}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    alert('הגיבוי הורד למחשב. שמור אותו במקום קבוע (למשל Google Drive) - זה מכיל את כל הנתונים החשובים נכון לרגע זה.');
  }catch(e){
    console.error('backup export failed', e);
    alert('משהו השתבש בגיבוי. נסה שוב.');
  }finally{
    if(btn){ btn.textContent = originalText; btn.disabled = false; }
  }
}
async function fetchAllRows(table, columns){
  let all = [];
  let from = 0;
  const pageSize = 1000;
  while(true){
    const {data, error} = await sb.from(table).select(columns).range(from, from+pageSize-1);
    if(error){ console.error('fetchAllRows error', table, error); break; }
    all = all.concat(data||[]);
    if(!data || data.length < pageSize) break; // הגענו לסוף
    from += pageSize;
  }
  return all;
}
const FREELANCE_LOG_EXCLUDE = ['אמיר בן אהרון'];
async function loadFreelanceLog(){
  const [shiftsData, magData] = await Promise.all([
    fetchAllRows('shifts', 'week_start,day_of_week,freelance_name,freelance_recorder_name'),
    fetchAllRows('magazine_teams', 'week_start,day_of_week,freelance_photographer_name,freelance_recorder_name,magazine')
  ]);
  const sRes = {data: shiftsData};
  const mRes = {data: magData};
  const normName = (n) => (n||'').normalize('NFC').replace(/[\u200B-\u200F\u202A-\u202E\uFEFF]/g, '').replace(/\s+/g,' ').trim();
  const entries = []; // {date, name, role}
  const addDate = (weekStart, dayIdx) => {
    const d = new Date(weekStart); d.setDate(d.getDate()+dayIdx);
    return dateStr(d);
  };
  (sRes.data||[]).forEach(s=>{
    const d = addDate(s.week_start, s.day_of_week);
    if(s.freelance_name && s.freelance_name!=='?') entries.push({date:d, name:normName(s.freelance_name), role:'photographer'});
    if(s.freelance_recorder_name && s.freelance_recorder_name!=='?') entries.push({date:d, name:normName(s.freelance_recorder_name), role:'recorder'});
  });
  (mRes.data||[]).forEach(t=>{
    const d = addDate(t.week_start, t.day_of_week);
    if(t.freelance_photographer_name && t.freelance_photographer_name!=='?') entries.push({date:d, name:normName(t.freelance_photographer_name), role:'photographer'});
    if(t.freelance_recorder_name && t.freelance_recorder_name!=='?') entries.push({date:d, name:normName(t.freelance_recorder_name), role:'recorder'});
  });
  // קיבוץ: חודש -> שם פרילנס -> סט תאריכים ייחודי (לרשימה לפי אדם)
  const filteredEntries = entries.filter(e=>!FREELANCE_LOG_EXCLUDE.includes(e.name));
  const byMonth = {};
  // קיבוץ נוסף: חודש -> תפקיד -> סט (שם+תאריך) ייחודי (לסיכום הכולל)
  const roleTotalsByMonth = {};
  filteredEntries.forEach(({date,name,role})=>{
    const monthKey = date.slice(0,7); // YYYY-MM
    byMonth[monthKey] = byMonth[monthKey] || {};
    byMonth[monthKey][name] = byMonth[monthKey][name] || new Set();
    byMonth[monthKey][name].add(date);

    roleTotalsByMonth[monthKey] = roleTotalsByMonth[monthKey] || {photographer:new Set(), recorder:new Set()};
    roleTotalsByMonth[monthKey][role].add(name+'|'+date);
  });
  freelanceLogData = byMonth;
  freelanceRoleTotals = roleTotalsByMonth;
  render();
}

  months.forEach(monthKey=>{

      <span class="sub" style="font-size:12px">${totalDays} ימי פרילנס סה"כ</span>
    </div>`;

      const dates = [...freelanceLogData[monthKey][name]].sort();
      const shortDates = dates.map(d=>d.slice(8,10)+'/'+d.slice(5,7)).join(', ');
      html += `<div class="vac-item">
        <div><b>${name}</b> · ${dates.length} ימים</div>
        <div class="sub" style="font-size:12px">${shortDates}</div>
      </div>`;
    });
  });
  return html;
}

function renderToplineLog(){

    <input type="date" id="tl-new-date">
    <input placeholder="מה עשו" id="tl-new-desc" style="flex:1;min-width:200px">
    <button class="btn btn-primary" onclick="addToplineLogEntry()">➕ הוסף רשומה</button>
  </div>`;
  if(!toplineLog.length){
    html += `<div class="empty-msg">אין עדיין רשומות ביומן</div>`;

  }
  // קיבוץ לפי חודש-שנה, בסדר יורד (החודש האחרון קודם), השורות בתוך כל חודש ממוינות מהחדש לישן
  const groups = {};
  const order = [];
  toplineLog.forEach(l=>{
    const dt = new Date(l.log_date);
    const key = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;
    if(!groups[key]){ groups[key] = []; order.push(key); }
    groups[key].push(l);
  });
  order.sort((a,b)=>b.localeCompare(a));

  // סיכום חודשי - לצורך התחשבנות מול טופליין
  html += `<div style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:20px">
    <h3 style="font-size:14px;margin:0 0 10px">📊 סיכום חודשי - לפי מספר הפעלות</h3>
    <table style="width:100%;font-size:13px;border-collapse:collapse">
      <thead><tr style="border-bottom:1px solid var(--line)"><th style="text-align:right;padding:4px 0">חודש</th><th style="text-align:left;padding:4px 0">הפעלות</th></tr></thead>
      <tbody>
        ${order.map(key=>{
          const [y,m] = key.split('-');
          return `<tr style="border-bottom:1px solid #F0F0EE"><td style="padding:4px 0">${HEB_MONTHS[parseInt(m,10)-1]} ${y}</td><td style="text-align:left;padding:4px 0;font-weight:700">${groups[key].length}</td></tr>`;
        }).join('')}
        <tr><td style="padding:6px 0;font-weight:700">סה"כ</td><td style="text-align:left;padding:6px 0;font-weight:700">${toplineLog.length}</td></tr>
      </tbody>
    </table>
  </div>`;

  order.forEach(key=>{
    const [y, m] = key.split('-');
    const items = groups[key];
    html += `<div style="margin:18px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--line);display:flex;justify-content:space-between;align-items:baseline">
      <h3 style="font-size:14px;margin:0">${HEB_MONTHS[parseInt(m,10)-1]} ${y}</h3>
      <span class="sub" style="font-size:12px">${items.length} הפעלות</span>
    </div>`;
    items.forEach(l=>{
      const dt = new Date(l.log_date);
      const dayLabel = l.day_label || (DAYS[dt.getDay()] ? DAYS[dt.getDay()].label : '');
      html += `<div class="vac-item">
        <div style="flex:1">
          <b>${dayLabel}</b> · ${l.log_date}
          <div style="margin-top:4px"><input value="${(l.description||'').replace(/"/g,'&quot;')}" style="width:100%" onchange="updateToplineLogEntry('${l.id}','description',this.value)"></div>
        </div>
        <button class="btn btn-sm btn-danger" onclick="deleteToplineLogEntry('${l.id}')">מחק</button>
      </div>`;
    });
  });
  return html;
}
async function addToplineLogEntry(){

  if(!dateVal || !desc){ alert('נא למלא תאריך ותיאור'); return; }

async function updateTopline(day, id, value){
  if(id){
    await sb.from('topline_notes').update({note:value}).eq('id',id);
    const n = toplineNotes.find(x=>x.id===id); if(n) n.note=value;
  } else {
    const {data} = await sb.from('topline_notes').insert({week_start:weekStart, day_of_week:day, note:value}).select();
    if(data) toplineNotes.push(data[0]);
  }
  if(value && value.trim()){
    const logDate = dateForDay(day);
    const dayLabel = (DAYS.find(d=>d.i===day)||{}).label || '';
    try{
      // מחפשים רשומה אוטומטית קיימת לאותו יום (לא נוגעים ברשומות שהוזנו ידנית לאותו תאריך - אלה נשארות בנפרד)
      const existingAuto = toplineLog.find(l=>l.log_date===logDate && l.source==='auto');
      let logData;
      if(existingAuto){
        const {data} = await sb.from('topline_log').update({day_label:dayLabel, description:value.trim()}).eq('id', existingAuto.id).select();
        logData = data;
      } else {
        const {data} = await sb.from('topline_log').insert({log_date:logDate, day_label:dayLabel, description:value.trim(), source:'auto'}).select();
        logData = data;
      }
      if(logData && logData.length){
        const idx = toplineLog.findIndex(l=>l.id===logData[0].id);
        if(idx!==-1) toplineLog[idx] = logData[0]; else toplineLog.push(logData[0]);
      }
    }catch(e){ console.error('topline log sync failed', e); }
  }
}

/* ---------- פופאפ בחירת עובד ---------- */
let popupCtx = null;
function sundayOfDateStr(ds){
  const [y,m,d] = ds.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const day = dt.getDay();
  dt.setDate(dt.getDate()-day);
  return dateStr(dt);
}
async function openWorkerPopup(kind, id, role){
  popupCtx = {kind, id, role};
  const list = workers.filter(w=>w.type===role && w.active);
  const freeList = freelancers.filter(f=>f.type===role && f.active);
  document.getElementById('popup-title').textContent = role==='photographer' ? 'בחר צלם' : 'בחר מקליט';

  // מציאת התאריך הרלוונטי כדי לבדוק חופש/מחלה מוצהרת
  let dayIdx = null;
  if(kind==='shift'){ const s = shifts.find(x=>x.id===id); dayIdx = s ? s.day_of_week : null; }
  else { const t = magTeams.find(x=>x.id===id); dayIdx = t ? t.day_of_week : null; }
  const targetDate = dayIdx!=null ? dateForDay(dayIdx) : null;

  const vacationIds = new Set();
  if(targetDate){
    vacationRequests.forEach(v=>{
      if(v.status==='approved' && v.from_date<=targetDate && v.to_date>=targetDate) vacationIds.add(v.worker_id);
    });
  }
  const constraintMap = new Map();
  if(targetDate){
    const targetWeekStart = sundayOfDateStr(targetDate);
    try{
      const {data} = await sb.from('constraints').select('worker_id,status,note').eq('week_start', targetWeekStart).eq('day_of_week', dayIdx);
      (data||[]).forEach(r=>{ constraintMap.set(r.worker_id, {status:r.status, note:r.note||''}); });
    }catch(e){ console.warn('constraint check failed', e); }
  }

  // בדיקת שיבוץ כפול — אותו עובד כבר משובץ באותו יום במקום אחר בסידור
  const doubleBookedMap = new Map();
  let isEditingOnCall = false;
  if(kind==='shift'){ const cur = shifts.find(x=>x.id===id); if(cur && cur.label==='כונן') isEditingOnCall = true; }
  if(dayIdx!=null && !isEditingOnCall){
    shifts.forEach(s=>{
      if(s.day_of_week!==dayIdx) return;
      if(s.label==='כונן') return; // כוננות לא נחשבת "משמרת" לצורך התנגשות
      if(kind==='shift' && s.id===id) return;
      const where = `${REGIONS[s.region]?.name||s.region} — ${s.label}`;
      if(s.worker_id && !doubleBookedMap.has(s.worker_id)) doubleBookedMap.set(s.worker_id, where);
      if(s.recorder_id && !doubleBookedMap.has(s.recorder_id)) doubleBookedMap.set(s.recorder_id, where);
    });
    magTeams.forEach(t=>{
      if(t.day_of_week!==dayIdx) return;
      if(kind==='team' && t.id===id) return;
      const where = MAGAZINES[t.magazine]?.name||t.magazine;
      if(t.photographer_id && !doubleBookedMap.has(t.photographer_id)) doubleBookedMap.set(t.photographer_id, where);
      if(t.recorder_id && !doubleBookedMap.has(t.recorder_id)) doubleBookedMap.set(t.recorder_id, where);
    });
  }

  const optHtml = w=>{
    const onVacation = vacationIds.has(w.id);
    const cinfo = constraintMap.get(w.id);
    const cstatus = cinfo ? cinfo.status : null;
    const doubleBookedWhere = doubleBookedMap.get(w.id);
    let warn = '';
    let blocking = false;
    if(onVacation){ warn = ' 🏖️ (בחופש)'; blocking = true; }
    else if(cstatus==='comp_day'){ warn = ' 🔁 (יום תמורה)'; blocking = true; }
    else if(cstatus==='sick'){ warn = ' 🤒 (מחלה מוצהרת)'; blocking = true; }
    else if(doubleBookedWhere){ warn = ` ⚠️ (כבר משובץ/ת: ${doubleBookedWhere})`; blocking = true; }
    else if(cstatus && cstatus!=='available'){
      const st = CONSTRAINT_STATUSES.find(x=>x.id===cstatus);
      const label = st ? st.label : cstatus;
      warn = ` 🕐 (${label}${cinfo.note?' — '+cinfo.note:''})`;
    }
    const blockReason = onVacation?'בחופש':(cstatus==='comp_day'?'ביום תמורה':(cstatus==='sick'?'במחלה':(doubleBookedWhere?`כבר משובץ/ת היום ב-${doubleBookedWhere}`:'')));
    const clickAction = blocking
      ? `confirmAndPickWorker('${w.id}','${blockReason.replace(/'/g,"\\'")}')`
      : `pickWorker('${w.id}')`;
    const cls = blocking ? ' vac-warn' : (warn ? ' pref-info' : '');
    return `<div class="popup-opt${cls}" onclick="${clickAction}">${w.name}${warn}</div>`;
  };

  let html = `<div class="popup-opt clear" onclick="pickWorker(null)">— ריק —</div>` +
    list.map(optHtml).join('');
  if(freeList.length){
    html += `<div style="font-size:11px;color:var(--muted);margin:10px 0 4px;padding-top:8px;border-top:1px solid var(--line)">פרילנסרים</div>` +
      freeList.map(f=>`<div class="popup-opt" onclick="pickFreelancer('${f.name.replace(/'/g,"\\'")}')">👤 ${f.name}</div>`).join('');
  }
  document.getElementById('popup-opts').innerHTML = html;
  document.getElementById('popup-overlay').classList.add('show');
}
function closePopup(){ document.getElementById('popup-overlay').classList.remove('show'); popupCtx=null; }
function confirmAndPickWorker(workerId, blockReason){
  const w = workers.find(x=>x.id===workerId);
  const name = w ? w.name : '';
  if(confirm(`${name} ${blockReason}. לשבץ בכל זאת?`)) pickWorker(workerId);
}
async function pickWorker(workerId){
  if(!popupCtx) return;
  const {kind, id, role} = popupCtx;
  if(kind==='shift'){
    if(role==='recorder'){
      await sb.from('shifts').update({recorder_id:workerId, freelance_recorder_name:''}).eq('id',id);
      const s = shifts.find(x=>x.id===id); if(s){ s.recorder_id=workerId; s.freelance_recorder_name=''; }
    } else {
      await sb.from('shifts').update({worker_id:workerId, freelance_name:''}).eq('id',id);
      const s = shifts.find(x=>x.id===id); if(s){ s.worker_id=workerId; s.freelance_name=''; }
    }
  } else {
    const field = role==='photographer' ? 'photographer_id' : 'recorder_id';
    const freeField = role==='photographer' ? 'freelance_photographer_name' : 'freelance_recorder_name';
    await sb.from('magazine_teams').update({[field]:workerId, [freeField]:''}).eq('id',id);
    const t = magTeams.find(x=>x.id===id); if(t){ t[field]=workerId; t[freeField]=''; }
  }
  closePopup();
  render();
}
async function pickFreelancer(name){
  if(!popupCtx) return;
  const {kind, id, role} = popupCtx;
  if(kind==='shift'){
    if(role==='recorder'){
      await sb.from('shifts').update({freelance_recorder_name:name, recorder_id:null}).eq('id',id);
      const s = shifts.find(x=>x.id===id); if(s){ s.freelance_recorder_name=name; s.recorder_id=null; }
    } else {
      await sb.from('shifts').update({freelance_name:name, worker_id:null}).eq('id',id);
      const s = shifts.find(x=>x.id===id); if(s){ s.freelance_name=name; s.worker_id=null; }
    }
  } else {
    const field = role==='photographer' ? 'photographer_id' : 'recorder_id';
    const freeField = role==='photographer' ? 'freelance_photographer_name' : 'freelance_recorder_name';
    await sb.from('magazine_teams').update({[freeField]:name, [field]:null}).eq('id',id);
    const t = magTeams.find(x=>x.id===id); if(t){ t[freeField]=name; t[field]=null; }
  }
  closePopup();
  render();
}

/* ---------- אילוצים לשבוע הבא ---------- */
function renderConstraints(){
  const nextSunday = getWeekStart(constraintsWeekOffset);
  const activeWorkers = workers.filter(w=>w.active);
  let html = `<div class="week-nav" style="display:inline-flex;margin-bottom:10px">
    <button class="btn btn-sm" onclick="changeConstraintsWeek(-1)">◀</button>
    <span class="week-label" style="margin:0 8px">${fmtWeekLabel(nextSunday)}</span>
    <button class="btn btn-sm" onclick="changeConstraintsWeek(1)">▶</button>
  </div>`;
  if(accessRole==='producer'){
    html += `<div class="sub" style="margin-bottom:10px">תצוגת צפייה - סיכום האילוצים של הצוות לשבוע הנבחר.</div>`;
    html += renderConstraintsOverview();
    return html;
  }
  html += `<div class="sub" style="margin-bottom:10px">כל עובד בוחר את שמו ומסמן סטטוס לכל יום בשבוע שנבחר למעלה. אפשר לנווט קדימה למספר שבועות ולמלא מראש.</div>`;
  const windowOpen = editMode || isConstraintsWindowOpenForWeek(dateStr(nextSunday));
  if(!windowOpen){
    html += `<div style="background:var(--red-bg);color:var(--red);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px">🔒 ההגשה לשבוע הזה ננעלה (המועד היה עד יום חמישי 11:00). אפשר לצפות בלבד, ולסמן עבור שבועות מאוחרים יותר.</div>`;
  }
  const myWorkerId = getCurrentWorkerId();
  if(myWorkerId && !editMode){
    if(!selectedConstraintWorker) selectedConstraintWorker = myWorkerId;
    const myName = (workers.find(w=>w.id===myWorkerId)||{}).name || '';
    html += `<div class="sub" style="margin-bottom:10px">מסמן/ת עבור: <b>${myName}</b></div>`;
  } else {
    html += `<select class="worker-select" onchange="selectedConstraintWorker=this.value;render()">
    <option value="">— בחר את שמך —</option>
    ${activeWorkers.map(w=>`<option value="${w.id}" ${selectedConstraintWorker===w.id?'selected':''}>${w.name}</option>`).join('')}
  </select>`;
  }
  if(!selectedConstraintWorker){
    html += `<div class="empty-msg">בחר שם כדי לסמן אילוצים</div>`;
    html += renderConstraintsOverview();
    return html;
  }
  html += `<div class="constraint-days">`;
  DAYS.forEach(day=>{
    const d = new Date(nextSunday); d.setDate(d.getDate()+day.i);
    const ds = dateStr(d);
    const row = constraintsData.find(c=>c.worker_id===selectedConstraintWorker && c.day_of_week===day.i);
    const status = row ? (row.status||'available') : 'available';
    const note = row ? (row.note||'') : '';
    const st = CONSTRAINT_STATUSES.find(s=>s.id===status) || CONSTRAINT_STATUSES[0];
    html += `<div class="constraint-pill ${st.cls}" ${windowOpen?`onclick="openConstraintPopup(${day.i})"`:'style="cursor:not-allowed;opacity:0.75"'}>
      ${day.label}<span class="cdate">${ds.slice(8,10)}/${ds.slice(5,7)}</span><br>${st.label}${note?`<br><span class="cdate" style="direction:rtl">${note}</span>`:''}
    </div>`;
  });
  html += `</div>`;
  html += renderConstraintsOverview();
  return html;
}
function renderConstraintsOverview(){
  const nextSunday = getWeekStart(constraintsWeekOffset);
  const activeWorkers = workers.filter(w=>w.active);
  const groupOrder = [
    {key:'ta', label:'צלמי ת"א', type:'photographer'},
    {key:'jerusalem', label:'צלמי ירושלים', type:'photographer'},
    {key:'south', label:'צלמי דרום', type:'photographer'},
    {key:'haifa', label:'צלמי חיפה', type:'photographer'},
    {key:'ta', label:'מקליטי ת"א', type:'recorder'},
    {key:'jerusalem', label:'מקליטי ירושלים', type:'recorder'},
    {key:'haifa', label:'מקליטי חיפה', type:'recorder'}
  ];
  const rowHtml = w=>{
    let cells = '';
    DAYS.forEach(day=>{
      const row = constraintsData.find(c=>c.worker_id===w.id && c.day_of_week===day.i);
      const status = row ? (row.status||'available') : 'available';
      const note = row ? (row.note||'') : '';
      const st = CONSTRAINT_STATUSES.find(s=>s.id===status) || CONSTRAINT_STATUSES[0];
      const shortLabel = status==='available' ? '' : st.label;
      cells += `<td class="day-cell overview-cell ${st.cls}">${shortLabel}${note?`<br><span style="font-weight:400">${note}</span>`:''}</td>`;
    });
    return `<tr><td class="row-label">${w.name}</td>${cells}</tr>`;
  };

  let bodyRows = '';
  const usedIds = new Set();
  groupOrder.forEach(g=>{
    const groupWorkers = activeWorkers.filter(w=>w.type===g.type && w.region===g.key);
    if(!groupWorkers.length) return;
    groupWorkers.forEach(w=>usedIds.add(w.id));
    bodyRows += `<tr><td class="row-label" colspan="8" style="background:#EFEFEC;text-align:right">${g.label}</td></tr>`;
    bodyRows += groupWorkers.map(rowHtml).join('');
  });
  const leftover = activeWorkers.filter(w=>!usedIds.has(w.id));
  if(leftover.length){
    bodyRows += `<tr><td class="row-label" colspan="8" style="background:#EFEFEC;text-align:right">אחר</td></tr>`;
    bodyRows += leftover.map(rowHtml).join('');
  }

  let html = `<h3 style="margin:22px 0 10px;font-size:14px">סקירה — כל העובדים</h3>
  <div class="table-scroll"><table class="master-table">
    <thead><tr><th class="row-label-col">עובד</th>${DAYS.map(d=>{
      const dd = new Date(nextSunday); dd.setDate(dd.getDate()+d.i);
      const ds = dateStr(dd);
      return `<th>${d.label}<span class="dnum">${ds.slice(8,10)}/${ds.slice(5,7)}</span></th>`;
    }).join('')}</tr></thead>
    <tbody>${bodyRows}</tbody>
  </table></div>`;
  return html;
}
let constraintPopupDay = null;
const BLOCKED_OPTION_ALLOWED = ['סרחיו ארדיטי', 'אורן יעקובוביץ'];
function openConstraintPopup(day){
  constraintPopupDay = day;
  document.getElementById('popup-title').textContent = 'בחר סטטוס ליום';
  const wName = workerName(selectedConstraintWorker) || '';
  const statuses = BLOCKED_OPTION_ALLOWED.includes(wName) ? CONSTRAINT_STATUSES : CONSTRAINT_STATUSES.filter(s=>s.id!=='blocked');
  document.getElementById('popup-opts').innerHTML = statuses.map(s=>`<div class="popup-opt" onclick="pickConstraintStatus('${s.id}')">${s.label}</div>`).join('');
  document.getElementById('popup-overlay').classList.add('show');
}
async function pickConstraintStatus(status){
  const nextWeekStart = dateStr(getWeekStart(constraintsWeekOffset));
  if(!editMode && !isConstraintsWindowOpenForWeek(nextWeekStart)){
    alert('ההגשה לשבוע הזה כבר ננעלה (המועד היה עד יום חמישי 11:00).');
    closePopup();
    return;
  }
  if(status==='blocked' && !BLOCKED_OPTION_ALLOWED.includes(workerName(selectedConstraintWorker)||'')){
    alert('אפשרות זו אינה זמינה עבור עובד זה.');
    closePopup();
    return;
  }
  const day = constraintPopupDay;
  const existing = constraintsData.find(c=>c.worker_id===selectedConstraintWorker && c.day_of_week===day);
  let note = existing ? (existing.note||'') : '';
  const wantsNote = status!=='available' && status!=='blocked';
  if(wantsNote){
    const entered = prompt('שעות מועדפות (לא חובה, למשל 10:00-18:00):', note);
    if(entered!==null) note = entered.trim();
  } else if(status==='blocked' || status==='sick'){
    note = '';
  }
  if(existing){
    await sb.from('constraints').update({status, note, available: status!=='blocked'}).eq('id',existing.id);
    existing.status = status; existing.note = note; existing.available = status!=='blocked';
  } else {
    const {data} = await sb.from('constraints').insert({week_start:nextWeekStart, worker_id:selectedConstraintWorker, day_of_week:day, status, note, available: status!=='blocked'}).select();
    if(data) constraintsData.push(data[0]);
  }
  closePopup();
  render();
}

/* ---------- בקשות חופשה ---------- */

  const activeWorkers = workers.filter(w=>w.active);
  const myWorkerId = getCurrentWorkerId();
  const lockToSelf = myWorkerId && !editMode;
  let html = `<div class="vac-form">
    <div class="field"><label>שם</label>
      ${lockToSelf
        ? `<input type="hidden" id="vac-worker" value="${myWorkerId}"><div style="padding:8px 0;font-weight:700">${(workers.find(w=>w.id===myWorkerId)||{}).name||''}</div>`
        : `<select id="vac-worker">
        <option value="">בחר עובד</option>
        ${activeWorkers.map(w=>`<option value="${w.id}">${w.name}</option>`).join('')}
      </select>`}
    </div>
    <div class="field"><label>מתאריך</label><input type="date" id="vac-from"></div>
    <div class="field"><label>עד תאריך</label><input type="date" id="vac-to"></div>
    <div class="field"><label>הערה (לא חובה)</label><input type="text" id="vac-note" placeholder="סיבה..."></div>
    <button class="btn btn-primary" onclick="submitVacation()">${editMode?'➕ הוסף חופשה מאושרת (ידני)':'שלח בקשה'}</button>
  </div>`;

  const pending = vacationRequests.filter(v=>v.status==='pending');
  const canSeePending = editMode || accessRole==='manager';
  if(canSeePending && pending.length){
    html += `<h3 style="font-size:13px;margin-bottom:8px">בקשות ממתינות לאישור${editMode?'':' (להזנת סיסמה לאישור/דחייה - היכנס למצב עריכה)'}</h3>`;
    pending.forEach(v=>{
      const overlapping = vacationRequests.filter(o=>o.id!==v.id && o.status==='approved' && o.from_date<=v.to_date && v.from_date<=o.to_date);
      html += `<div class="vac-item">
        <div style="flex:1">
          <div><b>${workerName(v.worker_id)||'—'}</b> · ${v.from_date}${v.from_date!==v.to_date?' עד '+v.to_date:''} ${v.note?'· '+v.note:''}</div>
          <div class="sub" style="font-size:11px;margin-top:2px">נשלחה: ${fmtDateShort(v.created_at)}</div>
          ${overlapping.length ? `<div class="sub" style="font-size:12px;margin-top:3px">👥 עוד ${overlapping.length} מאושרים באותם תאריכים: ${overlapping.map(o=>workerName(o.worker_id)).join(', ')}</div>` : `<div class="sub" style="font-size:12px;margin-top:3px">אף אחד אחר לא מאושר בתאריכים האלה</div>`}
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          <span class="vac-status pending">ממתין</span>
          ${editMode?`
          <button class="btn btn-sm btn-primary" onclick="setVacStatus('${v.id}','approved')">אשר</button>
          <button class="btn btn-sm btn-danger" onclick="setVacStatus('${v.id}','rejected')">דחה</button>
          `:''}
        </div>
      </div>`;
    });
  }

  html += `<h3 style="font-size:13px;margin:16px 0 8px">${canSeePending?'כל הבקשות':'חופשות מאושרות'}</h3>`;
  const rest = [...vacationRequests]
    .filter(v=> canSeePending || v.status==='approved')
    .sort((a,b)=>b.created_at.localeCompare(a.created_at));
  if(!rest.length) html += `<div class="empty-msg">${canSeePending?'אין בקשות עדיין':'אין עדיין חופשות מאושרות'}</div>`;
  rest.forEach(v=>{
    html += `<div class="vac-item">
      <div>
        <div><b>${workerName(v.worker_id)||'—'}</b> · ${v.from_date}${v.from_date!==v.to_date?' עד '+v.to_date:''} ${(canSeePending && v.note)?'· '+v.note:''}</div>
        <div class="sub" style="font-size:11px;margin-top:2px">נשלחה: ${fmtDateShort(v.created_at)}${v.decided_at?` · הוחלט: ${fmtDateShort(v.decided_at)}`:''}</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        ${v.req_type==='sick'?'<span class="vac-status sicktype">🤒 מחלה</span>':''}
        <span class="vac-status ${v.status}">${v.status==='approved'?'מאושר':v.status==='rejected'?'נדחה':'ממתין'}</span>
        ${editMode?`
          <button class="btn btn-sm" onclick="editVacationDates('${v.id}')">ערוך תאריכים</button>
          ${v.status!=='approved'?`<button class="btn btn-sm btn-primary" onclick="setVacStatus('${v.id}','approved')">אשר</button>`:''}
          ${v.status!=='rejected'?`<button class="btn btn-sm btn-danger" onclick="setVacStatus('${v.id}','rejected')">${v.status==='approved'?'בטל אישור':'דחה'}</button>`:''}
          ${v.status!=='pending'?`<button class="btn btn-sm" onclick="setVacStatus('${v.id}','pending')">החזר לממתין</button>`:''}
          <button class="btn btn-sm btn-danger" onclick="deleteVacation('${v.id}')">מחק</button>
        `:''}
      </div>
    </div>`;
  });
  return html;
}
async function editVacationDates(id){
  const v = vacationRequests.find(x=>x.id===id);
  if(!v) return;
  const newFrom = prompt('מתאריך (YYYY-MM-DD):', v.from_date);
  if(newFrom===null) return;
  const newTo = prompt('עד תאריך (YYYY-MM-DD):', v.to_date);
  if(newTo===null) return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(newFrom) || !/^\d{4}-\d{2}-\d{2}$/.test(newTo)){
    alert('פורמט תאריך לא תקין - נדרש YYYY-MM-DD');
    return;
  }
  const {error} = await sb.from('vacation_requests').update({from_date:newFrom, to_date:newTo}).eq('id',id);
  if(error){ alert('שגיאה בעדכון - כנראה חפיפה עם חופשה מאושרת אחרת של אותו עובד.'); return; }
  v.from_date = newFrom; v.to_date = newTo;
  render();
}
async function deleteVacation(id){
  if(!confirm('למחוק את הבקשה הזו לגמרי? (פעולה זו לא שולחת מייל לעובד)')) return;
  await sb.from('vacation_requests').delete().eq('id',id);
  vacationRequests = vacationRequests.filter(v=>v.id!==id);
  render();
}
async function submitVacation(){
  const worker_id = document.getElementById('vac-worker').value;
  const from_date = document.getElementById('vac-from').value;
  const to_date = document.getElementById('vac-to').value || from_date;
  const note = document.getElementById('vac-note').value;
  if(!worker_id || !from_date){ alert('נא לבחור עובד ותאריך'); return; }
  if(editMode){
    // בדיקת חפיפה עם חופשה קיימת לאותו עובד, לפני שמירה
    const overlap = vacationRequests.find(v=>v.worker_id===worker_id && v.status==='approved' && v.from_date<=to_date && from_date<=v.to_date);
    if(overlap){
      alert(`ל${workerName(worker_id)} כבר יש חופשה מאושרת בין ${overlap.from_date} ל-${overlap.to_date} שחופפת לתאריכים האלה.\nהמערכת לא מאפשרת כפילות - אם צריך לשנות, ערוך או מחק קודם את הרשומה הקיימת.`);
      return;
    }
    // מנהל מזין ישירות חופשה שכבר סוכמה (למשל בוואטסאפ) - נכנסת ישר כ"מאושר", בלי מייל ובלי שלב אישור
    const {data, error} = await sb.from('vacation_requests').insert({worker_id, from_date, to_date, note, status:'approved', req_type:'vacation'}).select();
    if(error){ alert('שגיאה: נראה שיש כבר חופשה מאושרת חופפת לעובד הזה בתאריכים האלה. הרשומה לא נשמרה כדי למנוע כפילות.'); return; }
    if(data) vacationRequests.push(data[0]);
    render();
    return;
  }
  const {data, error} = await sb.from('vacation_requests').insert({worker_id, from_date, to_date, note, status:'pending', req_type:'vacation'}).select();
  if(error){ alert('שגיאה בשמירת הבקשה. נסה שוב.'); return; }
  if(data) vacationRequests.push(data[0]);
  sendVacationRequestEmail(workerName(worker_id), from_date, to_date, note);
  render();
}
async function setVacStatus(id, status){
  if(status==='approved'){
    const v = vacationRequests.find(x=>x.id===id);
    if(v){
      const overlap = vacationRequests.find(o=>o.id!==id && o.worker_id===v.worker_id && o.status==='approved' && o.from_date<=v.to_date && v.from_date<=o.to_date);
      if(overlap){
        alert(`לא ניתן לאשר - יש כבר חופשה מאושרת חופפת (${overlap.from_date} עד ${overlap.to_date}) לאותו עובד. יש לטפל בכפילות קודם.`);
        return;
      }
    }
  }
  const decidedAt = new Date().toISOString();
  const {error} = await sb.from('vacation_requests').update({status, decided_at:decidedAt}).eq('id',id);
  if(error){ alert('שגיאה בעדכון הסטטוס - כנראה חפיפה עם חופשה מאושרת אחרת.'); return; }
  const v = vacationRequests.find(x=>x.id===id); if(v){ v.status=status; v.decided_at=decidedAt; }
  if(v && status!=='pending'){
    const w = workers.find(x=>x.id===v.worker_id);
    if(w) sendVacationResponseEmail(w.email, w.name, status, v.from_date, v.to_date);
  }
  render();
}

function renderCalendar(){
  const dayNames = ['א','ב','ג','ד','ה','ו','ש'];
  let html = `<div class="cal-nav">
    <button class="btn btn-sm" onclick="changeMonth(-1)">◀</button>
    <div style="font-weight:600;font-size:14px;min-width:120px;text-align:center">${MONTHS_HE[calMonth]} ${calYear}</div>
    <button class="btn btn-sm" onclick="changeMonth(1)">▶</button>
  </div>
  <div class="cal-grid">${dayNames.map(d=>`<div class="cal-dayname">${d}</div>`).join('')}`;
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const todayStr = dateStr(new Date());
  for(let i=0;i<firstDay;i++) html += `<div class="cal-cell empty-cal"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = ds===todayStr;
    const approved = vacationRequests.filter(v=>v.status==='approved' && ds>=v.from_date && ds<=v.to_date);
    const tags = approved.map(v=> v.req_type==='sick'
      ? `<div class="vac-tag-cal" style="background:#A32D2D">🤒 ${workerName(v.worker_id)||'—'}</div>`
      : `<div class="vac-tag-cal" style="background:${colorFor(v.worker_id)}">${workerName(v.worker_id)||'—'}</div>`
    ).join('');
    html += `<div class="cal-cell ${isToday?'today':''}"><div class="cal-daynum">${d}</div>${tags}</div>`;
  }
  html += `</div>`;
  return html;
}
function changeMonth(delta){
  calMonth += delta;
  if(calMonth<0){ calMonth=11; calYear--; }
  if(calMonth>11){ calMonth=0; calYear++; }
  render();
}

function workerDayStatus(workerId, dayIdx, ds){
  const items = [];
  let hasRealShift = false;
  let isPaidDay = false; // משמרת אמיתית, חופש מאושר, או מחלה - יום שעליו העובד מקבל תשלום
  shifts.forEach(s=>{
    if(s.day_of_week!==dayIdx) return;
    if(s.worker_id===workerId || s.recorder_id===workerId){
      const regionName = REGIONS[s.region]?.name || s.region;
      items.push(s.label==='כונן' ? `כונן (${regionName})` : regionName);
      if(s.label!=='כונן'){ hasRealShift = true; isPaidDay = true; }
    }
    if(s.sick_worker_id===workerId || s.sick_recorder_id===workerId){ items.push('🤒 מחלה (בפועל)'); isPaidDay = true; }
  });
  magTeams.forEach(t=>{
    if(t.day_of_week!==dayIdx) return;
    if(t.photographer_id===workerId || t.recorder_id===workerId){
      items.push(MAGAZINES[t.magazine]?.name || t.magazine);
      hasRealShift = true; isPaidDay = true;
    }
    if(t.sick_photographer_id===workerId || t.sick_recorder_id===workerId){ items.push('🤒 מחלה (בפועל)'); isPaidDay = true; }
  });
  const activeVac = vacationRequests.find(v=>v.status==='approved' && v.worker_id===workerId && v.from_date<=ds && v.to_date>=ds);
  if(activeVac){ items.push(activeVac.req_type==='sick' ? '🤒 מחלה מתוכננת' : '🏖️ חופש מאושר'); isPaidDay = true; }
  const c = overviewConstraints.find(x=>x.worker_id===workerId && x.day_of_week===dayIdx);
  if(c){
    if(c.status==='sick'){ items.push('🤒 מחלה (מוצהר)'); isPaidDay = true; }
    if(c.status==='comp_day') items.push('🔁 יום תמורה (בקשה)');
  }
  return {items, hasRealShift, isPaidDay};
}
function renderOverview(){
  const sunday = getWeekStart(weekOffset);
  const weekDates = DAYS.map(d=>{ const dt=new Date(sunday); dt.setDate(dt.getDate()+d.i); return dateStr(dt); });
  const activeWorkers = workers.filter(w=>w.active).sort((a,b)=>a.name.localeCompare(b.name,'he'));

  if(overviewConstraintsWeek !== weekStart){
    overviewConstraintsWeek = weekStart;
    sb.from('constraints').select('worker_id,day_of_week,status').eq('week_start', weekStart).then(({data})=>{
      overviewConstraints = data || [];
      if(activeTab==='overview') render();
    });
  }

  let totalMissed = 0;
  const rowHtml = w=>{
    const quota = w.weekly_quota==null ? 5 : w.weekly_quota;
    const dayResults = DAYS.map(d=>workerDayStatus(w.id, d.i, weekDates[d.i]));
    const weekCount = dayResults.filter(r=>r.isPaidDay).length;
    const underQuota = weekCount < quota;
    const cells = DAYS.map((d,i)=>{
      const {items, isPaidDay} = dayResults[i];
      const content = items.length ? items.join('<br>') : '';
      const highlightEmpty = underQuota && !isPaidDay;
      return `<td class="day-cell overview-cell" style="font-size:10px${highlightEmpty?';background:var(--red-bg)':''}">${content}</td>`;
    }).join('');
    const missed = weekCount===0;
    if(missed) totalMissed++;
    const namePrefix = missed ? '⚠️ ' : (underQuota ? '🔸 ' : '');
    const totalStyle = underQuota ? 'color:var(--red);font-weight:700' : '';
    return `<tr${missed?' style="background:var(--red-bg)"':''}><td class="row-label">${namePrefix}${w.name}</td>${cells}<td class="row-label" style="text-align:center;${totalStyle}">${weekCount} / ${quota}</td></tr>`;
  };

  const header = DAYS.map((d,i)=>{
    const ds = weekDates[i];
    return `<th>${d.label}<span class="dnum">${ds.slice(8,10)}/${ds.slice(5,7)}</span></th>`;
  }).join('');

  const rows = activeWorkers.map(rowHtml).join('');

  return `<div class="sub" style="margin-bottom:12px">מבט מרוכז — מי משובץ/מחלה/חופש בכל יום השבוע. סה"כ כולל גם ימי חופש/מחלה מאושרים (לא רק משמרות בפועל, כי גם עליהם מקבלים תשלום) - כוננות בלבד עדיין לא נספרת. עמודת "סה"כ" מציגה כמות מול התקן האישי (ניתן לעריכה בטאב "ניהול עובדים"). ימים ריקים אצל מי שמתחת לתקן מסומנים באדום. 🔸 = מתחת לתקן, ⚠️ = אין כלום השבוע.</div>
  <div class="table-scroll"><table class="master-table">
    <thead><tr><th class="row-label-col">עובד</th>${header}<th>סה"כ</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>
  <div class="sub" style="margin-top:10px">${totalMissed ? `⚠️ ${totalMissed} עובדים בלי אף משמרת השבוע` : '✅ לכולם יש לפחות משמרת אחת השבוע'}</div>`;
}

function renderDuty(){
  const todayStr = dateStr(new Date());
  const upcoming = dutyRoster.filter(d=>d.duty_date>=todayStr);
  const past = dutyRoster.filter(d=>d.duty_date<todayStr);

  // בדיקת חוסרים: כל שישי/שבת בטווח התאריכים של הלוח שאין לו רשומה בכלל, או שיש רשומה אבל בלי אף שיבוץ
  const gapWarnings = [];
  if(dutyRoster.length){
    const sanityMin = '2020-01-01', sanityMax = '2035-01-01';
    const oddDates = dutyRoster.filter(d=>d.duty_date < sanityMin || d.duty_date > sanityMax);
    if(oddDates.length){
      gapWarnings.push(`⚠️ נמצאו ${oddDates.length} תאריכים לא הגיוניים בלוח (למשל שנה שגויה): ${oddDates.map(d=>d.duty_date).join(', ')} - כדאי לתקן אותם ידנית, הבדיקה למטה מתעלמת מהם`);
    }
    const allDates = dutyRoster.map(d=>d.duty_date).filter(d=>d>=sanityMin && d<=sanityMax).sort();
    const minDate = allDates[0], maxDate = allDates[allDates.length-1];
    const dateSet = new Set(allDates);
    const cur = new Date(minDate);
    const maxDt = new Date(maxDate);
    while(cur <= maxDt){
      const dow = cur.getDay(); // 5=Friday, 6=Saturday
      if(dow===5 || dow===6){
        const ds = dateStr(cur);
        if(!dateSet.has(ds)){
          gapWarnings.push(`${ds} (${dow===5?'שישי':'שבת'}) - חסר לגמרי מהלוח`);
        }
      }
      cur.setDate(cur.getDate()+1);
    }
    dutyRoster.forEach(d=>{
      if(!d.ta1 && !d.jerusalem1){
        gapWarnings.push(`${d.duty_date} (${d.day_label||''}) - קיים בלוח אבל בלי אף שיבוץ`);
      }
    });
    gapWarnings.sort();
  }

  let html = `<div class="sub" style="margin-bottom:12px">לוח תורנויות שישי-שבת וחגים לאורך השנה. גלוי לכולם, עריכה רק למנהל.</div>
  <div class="sub" style="margin-bottom:12px"><span class="duty-original">שם בכחול</span> = שובץ במקור &nbsp; · &nbsp; <span class="duty-replace">שם בכתום</span> = החלפה בפועל (באחריות העובדים)</div>`;

  if(gapWarnings.length){
    html += `<div style="background:var(--red-bg);color:var(--red);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px">
      <b>⚠️ נמצאו ${gapWarnings.length} חוסרים בלוח התורנויות:</b>
      <ul style="margin:6px 0 0;padding-right:18px">${gapWarnings.map(w=>`<li>${w}</li>`).join('')}</ul>
    </div>`;
  }

  if(editMode){
    const threeWeeksAgo = shiftDateStr(todayStr, -21);
    const reminders = [];
    dutyRoster.forEach(d=>{
      if(!d.day_label || !d.day_label.includes('שבת')) return;
      if(d.comp_handled) return;
      if(d.duty_date>todayStr || d.duty_date<threeWeeksAgo) return;
      [d.ta1,d.ta2,d.jerusalem1,d.jerusalem2].forEach(name=>{
        if(name && name.trim() && !name.includes('מוחמד')){
          reminders.push({id:d.id, date:d.duty_date, name:name.trim()});
        }
      });
    });
    if(reminders.length){
      html += `<div class="my-shifts-box" style="border-color:var(--amber)">
        <div class="my-shifts-title" style="color:var(--amber)">⏰ תזכורת — מי עבד/ה בשבת וכדאי לתת יום תמורה (מידע בלבד, לא חוסם שיבוץ)</div>
        <div class="my-shifts-list">
          ${reminders.map(r=>`<div class="my-shift-card" style="background:var(--amber-bg);display:flex;justify-content:space-between;align-items:center">
            <span>${r.name} — עבד/ה בשבת ${r.date.slice(8,10)}/${r.date.slice(5,7)}</span>
            <button class="btn btn-sm" onclick="dismissDutyReminder('${r.id}')">✓ טופל</button>
          </div>`).join('')}
        </div>
      </div>`;
    }
  }

  if(editMode){
    html += `<button class="btn btn-primary btn-sm" style="margin-bottom:12px" onclick="addDutyRow()">+ הוסף תאריך</button>`;
  }
  const nameHtml = (n1,n2) => {
    if(!n1 && !n2) return '—';
    let out = n1 ? `<span class="duty-original">${n1}</span>` : '';
    if(n2) out += `${out?' ':''}<span class="duty-replace">↔ ${n2}</span>`;
    return out;
  };
  const rowHtml = d => `<tr>
    <td class="row-label" style="position:static;text-align:center;white-space:nowrap">${d.duty_date.slice(8,10)}/${d.duty_date.slice(5,7)}</td>
    <td class="day-cell" style="text-align:center;font-weight:600">${d.day_label||''}</td>
    <td class="day-cell" style="text-align:center">${nameHtml(d.ta1,d.ta2)}</td>
    <td class="day-cell" style="text-align:center">${nameHtml(d.jerusalem1,d.jerusalem2)}</td>
    <td class="day-cell" style="text-align:center">${editMode?`<button class="btn btn-sm" onclick="editDutyRow('${d.id}')">ערוך</button> <button class="btn btn-sm btn-danger" onclick="deleteDutyRow('${d.id}')">מחק</button>`:''}</td>
  </tr>`;
  html += `<div class="table-scroll"><table class="master-table">
    <thead><tr><th>תאריך</th><th>יום/חג</th><th>ת"א</th><th>ירושלים</th><th></th></tr></thead>
    <tbody>${upcoming.map(rowHtml).join('') || '<tr><td colspan="5" class="empty-msg">אין תאריכים עתידיים</td></tr>'}</tbody>
  </table></div>`;
  if(past.length){
    html += `<h3 style="font-size:13px;margin:18px 0 8px">תאריכים שעברו</h3>
    <div class="table-scroll"><table class="master-table">
      <thead><tr><th>תאריך</th><th>יום/חג</th><th>ת"א</th><th>ירושלים</th><th></th></tr></thead>
      <tbody>${past.slice().reverse().map(rowHtml).join('')}</tbody>
    </table></div>`;
  }
  return html;
}
async function dismissDutyReminder(id){
  await sb.from('duty_roster').update({comp_handled:true}).eq('id',id);
  const d = dutyRoster.find(x=>x.id===id); if(d) d.comp_handled=true;
  render();
}
async function addDutyRow(){
  const date = prompt('תאריך (YYYY-MM-DD):', '');
  if(!date) return;
  const day_label = prompt('יום/חג (למשל: שישי, שבת, שישי - ערב פסח):', '') || '';
  const ta1 = prompt('ת"א - שם ראשון:', '') || '';
  const ta2 = prompt('ת"א - שם שני (לא חובה):', '') || '';
  const jerusalem1 = prompt('ירושלים - שם ראשון:', '') || '';
  const jerusalem2 = prompt('ירושלים - שם שני (לא חובה):', '') || '';
  const {data, error} = await sb.from('duty_roster').insert({duty_date:date, day_label, ta1, ta2, jerusalem1, jerusalem2}).select();
  if(error){ alert('שגיאה - יכול להיות שכבר קיים תאריך כזה: '+error.message); return; }
  if(data) dutyRoster.push(data[0]);
  dutyRoster.sort((a,b)=>a.duty_date.localeCompare(b.duty_date));
  render();
}
async function editDutyRow(id){
  const d = dutyRoster.find(x=>x.id===id); if(!d) return;
  const day_label = prompt('יום/חג:', d.day_label||'');
  if(day_label===null) return;
  const ta1 = prompt('ת"א - שם ראשון:', d.ta1||'') ?? d.ta1;
  const ta2 = prompt('ת"א - שם שני (לא חובה):', d.ta2||'') ?? d.ta2;
  const jerusalem1 = prompt('ירושלים - שם ראשון:', d.jerusalem1||'') ?? d.jerusalem1;
  const jerusalem2 = prompt('ירושלים - שם שני (לא חובה):', d.jerusalem2||'') ?? d.jerusalem2;
  await sb.from('duty_roster').update({day_label, ta1, ta2, jerusalem1, jerusalem2}).eq('id',id);
  Object.assign(d, {day_label, ta1, ta2, jerusalem1, jerusalem2});
  render();
}
async function deleteDutyRow(id){
  if(!confirm('למחוק את השורה הזו?')) return;
  await sb.from('duty_roster').delete().eq('id',id);
  dutyRoster = dutyRoster.filter(d=>d.id!==id);
  render();
}

/* ===================== העתקת סידור לטקסט ===================== */
function copyScheduleText(){
  const sunday = getWeekStart(weekOffset);
  let out = `סידור עבודה — צלמים ומקליטים\nשבוע: ${fmtWeekLabel(sunday)}\n`;

  for(const [key,region] of Object.entries(REGIONS)){
    out += `\n=== ${region.name} ===\n`;
    DAYS.forEach(day=>{
      const dayShifts = sortShiftsChrono(shifts.filter(s=>s.region===key && s.day_of_week===day.i));
      if(!dayShifts.length) return;
      out += `${day.label} (${dateForDay(day.i).slice(8,10)}/${dateForDay(day.i).slice(5,7)}):\n`;
      dayShifts.forEach(s=>{
        const name = s.freelance_name ? freelanceLabel(s.freelance_name) : (workerName(s.worker_id) || '—');
        const sick = s.sick_worker_id ? ` [מחלה: ${workerName(s.sick_worker_id)}]` : '';
        out += `  ${s.label} (${s.start_time}-${s.end_time}): ${name}${sick}\n`;
      });
    });
  }

  out += `\n=== מגזינים ===\n`;
  for(const [key,mag] of Object.entries(MAGAZINES)){
    out += `\n${mag.name}:\n`;
    DAYS.forEach(day=>{
      const teams = magTeams.filter(t=>t.magazine===key && t.day_of_week===day.i).sort((a,b)=>a.row_order-b.row_order);
      const filled = teams.filter(t=>t.photographer_id||t.recorder_id||t.freelance_photographer_name||t.freelance_recorder_name);
      if(!filled.length) return;
      out += `${day.label}:\n`;
      filled.forEach(t=>{
        const p = t.freelance_photographer_name ? freelanceLabel(t.freelance_photographer_name) : (workerName(t.photographer_id)||'—');
        const r = t.freelance_recorder_name ? `${t.freelance_recorder_name}` : (workerName(t.recorder_id)||'—');
        out += `  צלם: ${p} | מקליט: ${r}`;
        if(t.reporter_name) out += ` | כתב: ${t.reporter_name}`;
        if(t.topic) out += ` | נושא: ${t.topic}`;
        if(t.area) out += ` | אזור: ${t.area}`;
        if(t.start_time) out += ` | ${t.start_time}-${t.end_time}`;
        out += `\n`;
      });
    });
  }

  const toplineActive = DAYS.some(d=>toplineNotes.find(n=>n.day_of_week===d.i && n.note));
  if(toplineActive){
    out += `\n=== טופליין — צפון רחוק ===\n`;
    DAYS.forEach(day=>{
      const n = toplineNotes.find(x=>x.day_of_week===day.i);
      if(n && n.note) out += `${day.label}: ${n.note}\n`;
    });
  }

  const mivtzaimActive = DAYS.some(d=>{
    const n = mivtzaimNotes.find(x=>x.day_of_week===d.i);
    return n && n.note && n.note.split('||').some(p=>p.trim());
  });
  if(mivtzaimActive){
    out += `\n=== מבצעים ===\n`;
    DAYS.forEach(day=>{
      const n = mivtzaimNotes.find(x=>x.day_of_week===day.i);
      if(n && n.note){
        const names = n.note.split('||').map(p=>p.trim()).filter(Boolean);
        if(names.length) out += `${day.label}: ${names.join(', ')}\n`;
      }
    });
  }

  const doCopy = (text)=>{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>alert('הסידור הועתק! אפשר להדביק במייל.')).catch(()=>fallbackCopy(text));
    } else fallbackCopy(text);
  };
  const fallbackCopy = (text)=>{
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); alert('הסידור הועתק! אפשר להדביק במייל.'); }
    catch(e){ alert('לא הצלחתי להעתיק אוטומטית — הטקסט מוצג בחלון הבא להעתקה ידנית.'); prompt('העתק ידנית (Ctrl+C):', text); }
    document.body.removeChild(ta);
  };
  doCopy(out);
}

function parseDayIndex(input){
  if(!input) return null;
  const t = input.trim();
  const byLabel = DAYS.findIndex(d=>d.label===t);
  if(byLabel>=0) return byLabel;
  const idx = DAYS_SHORT.indexOf(t);
  if(idx>=0) return idx;
  return null;
}
async function copyTeamToDay(teamId){
  const t = magTeams.find(x=>x.id===teamId);
  if(!t) return;
  const dayInput = prompt('להעתיק לאיזה יום? (כתוב שם מלא: ראשון / שני / שלישי / רביעי / חמישי / שישי / שבת)', '');
  if(dayInput===null) return;
  const dayIdx = parseDayIndex(dayInput);
  if(dayIdx===null){ alert('לא זיהיתי את היום. נסה שוב עם שם מלא כמו "שני" או "שלישי".'); return; }
  const weekInput = prompt('לאיזה שבוע להעתיק? השאר "0" לשבוע הנוכחי (שאתה צופה בו כרגע), או כתוב מספר שבועות קדימה — למשל 1 = שבוע הבא', '0');
  if(weekInput===null) return;
  const weeksAhead = parseInt(weekInput, 10) || 0;
  const targetWeekStart = weeksAhead===0 ? weekStart : dateStr(getWeekStart(weekOffset + weeksAhead));
  const isCurrentWeek = targetWeekStart === weekStart;

  let maxOrder = 0;
  if(isCurrentWeek){
    maxOrder = Math.max(0, ...magTeams.filter(x=>x.magazine===t.magazine && x.day_of_week===dayIdx).map(x=>x.row_order+1), 0);
  } else {
    const {data: existingRows} = await sb.from('magazine_teams').select('row_order').eq('week_start', targetWeekStart).eq('magazine', t.magazine).eq('day_of_week', dayIdx);
    maxOrder = Math.max(0, ...(existingRows||[]).map(x=>x.row_order+1), 0);
  }

  const {data, error} = await sb.from('magazine_teams').insert({
    week_start: targetWeekStart, magazine: t.magazine, day_of_week: dayIdx,
    photographer_id: t.photographer_id, recorder_id: t.recorder_id,
    freelance_photographer_name: t.freelance_photographer_name||'', freelance_recorder_name: t.freelance_recorder_name||'',
    reporter_name: t.reporter_name||'', topic: t.topic||'', area: t.area||'', shoot_day: t.shoot_day||'',
    start_time: t.start_time||'', end_time: t.end_time||'', row_order: maxOrder
  }).select();

  if(error){
    alert('שגיאה בהעתקה: '+error.message+'\n\nיכול להיות שצריך להריץ שוב את קובץ ה-schema המעודכן ב-Supabase (עמודת shoot_day חסרה).');
    return;
  }
  if(data){
    if(isCurrentWeek) magTeams.push(data[0]);
    alert(isCurrentWeek ? 'הועתק בהצלחה!' : `הועתק בהצלחה לשבוע ${fmtWeekLabel(getWeekStart(weekOffset+weeksAhead))} (נשמר, לא יופיע כאן כי אתה צופה בשבוע אחר)`);
  }
  render();
}
