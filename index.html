function matchWorkerByFirstName(name, type){
  if(!name) return null;
  const first = name.trim().split(' ')[0];
  const candidates = workers.filter(w=>w.type===type && w.active && firstName(w.name)===first);
  return candidates.length===1 ? candidates[0] : null;
}
async function importDutyToSchedule(){
  const sunday = getWeekStart(weekOffset);
  const weekDates = DAYS.map(d=>{ const dt=new Date(sunday); dt.setDate(dt.getDate()+d.i); return dateStr(dt); });
  const entries = dutyRoster.filter(d=>weekDates.includes(d.duty_date));
  if(!entries.length){ alert('לא נמצאו תאריכים בלוח התורנויות בשבוע הזה.'); return; }

  const imported = [];
  const unmatched = [];

  for(const entry of entries){
    const dayIdx = weekDates.indexOf(entry.duty_date);
    const isWeekend = dayIdx===5 || dayIdx===6;

    for(const [region, name] of [['ta', entry.ta2||entry.ta1], ['jerusalem', entry.jerusalem2||entry.jerusalem1]]){
      if(!name) continue;
      const worker = matchWorkerByFirstName(name, 'photographer');
      if(!worker){ unmatched.push(`${name} (${region==='ta'?'ת"א':'ירושלים'}, ${entry.duty_date})`); continue; }

      let targetShift = null;
      if(isWeekend){
        targetShift = shifts.find(s=>s.region===region && s.day_of_week===dayIdx);
      } else {
        targetShift = shifts.find(s=>s.region===region && s.day_of_week===dayIdx && s.label===entry.day_label);
      }

      if(targetShift){
        await sb.from('shifts').update({worker_id:worker.id}).eq('id',targetShift.id);
        targetShift.worker_id = worker.id;
      } else {
        const label = isWeekend ? 'משמרת' : (entry.day_label || 'תורנות');
        const time = isWeekend ? {start:'12:00', end:'22:00'} : {start:'', end:''};
        const maxOrder = Math.max(0, ...shifts.filter(x=>x.region===region && x.day_of_week===dayIdx).map(x=>x.row_order+1), 0);
        const {data} = await sb.from('shifts').insert({
          week_start: weekStart, region, day_of_week: dayIdx, label,
          start_time: time.start, end_time: time.end, worker_id: worker.id, row_order: maxOrder
        }).select();
        if(data) shifts.push(data[0]);
      }
      imported.push(`${worker.name} (${region==='ta'?'ת"א':'ירושלים'}, ${DAYS[dayIdx].label})`);
    }
  }

  render();
  let msg = imported.length ? `יובאו בהצלחה:\n${imported.join('\n')}` : 'לא יובא כלום.';
  if(unmatched.length) msg += `\n\nלא זוהו (תשבץ ידנית):\n${unmatched.join('\n')}`;
  alert(msg);
}

/* ===================== סטטיסטיקת שיבוצים ===================== */
function computeWorkerCounts(){
  const counts = {};
  workers.forEach(w=>counts[w.id]=0);
  shifts.forEach(s=>{
    if(s.worker_id && counts[s.worker_id]!==undefined) counts[s.worker_id]++;
    if(s.recorder_id && counts[s.recorder_id]!==undefined) counts[s.recorder_id]++;
  });
  magTeams.forEach(t=>{
    if(t.photographer_id && counts[t.photographer_id]!==undefined) counts[t.photographer_id]++;
    if(t.recorder_id && counts[t.recorder_id]!==undefined) counts[t.recorder_id]++;
  });
  return counts;
}
/* ===================== דוח ימי צילום לכתבות ===================== */
async function showShootDayReport(){
  document.getElementById('popup-title').textContent = 'דוח ימי צילום לכתבות';
  document.getElementById('popup-opts').innerHTML = `<div class="empty-msg">טוען...</div>`;
  document.getElementById('popup-overlay').classList.add('show');

  const data = await fetchAllRows('magazine_teams', 'reporter_name,topic,shoot_day');

  const groups = {};
  (data||[]).forEach(t=>{
    const reporter = (t.reporter_name||'').trim();
    if(!reporter) return;
    const key = `${reporter} — ${(t.topic||'').trim() || 'ללא נושא'}`;
    if(!groups[key]) groups[key] = new Set();
    const n = parseInt(t.shoot_day, 10);
    if(!isNaN(n)) groups[key].add(n);
  });

  const rows = Object.entries(groups).map(([key, daysSet])=>{
    const days = [...daysSet].sort((a,b)=>a-b);
    return {key, maxDay: days.length ? Math.max(...days) : 0, days};
  }).sort((a,b)=>b.maxDay-a.maxDay);

  document.getElementById('popup-opts').innerHTML = rows.length ? rows.map(r=>`
    <div class="popup-opt" style="cursor:default;display:block">
      <b>${r.key}</b><br>
      <span style="font-size:11px;color:var(--muted)">${r.maxDay ? `סה"כ ${r.maxDay} ימי צילום (רשומים: ${r.days.join(', ')})` : 'עדיין לא נרשם מספר יום'}</span>
    </div>
  `).join('') : `<div class="empty-msg">אין עדיין נתונים — צריך למלא "כתב" ו"יום צילום מספר" בכרטיסי המגזין.</div>`;
}

function showStats(){
  const counts = computeWorkerCounts();

  const photographers = workers.filter(w=>w.type==='photographer' && w.active).sort((a,b)=>counts[a.id]-counts[b.id]);
  const recorders = workers.filter(w=>w.type==='recorder' && w.active).sort((a,b)=>counts[a.id]-counts[b.id]);

  const rowHtml = w=>{
    const c = counts[w.id]||0;
    const zero = c===0;
    return `<div class="stat-row ${zero?'zero':''}">${zero?'⚠️ ':''}${w.name}<span class="stat-count">${c}</span></div>`;
  };

  const sunday = getWeekStart(weekOffset);
  document.getElementById('popup-title').textContent = `שיבוצים — שבוע ${fmtWeekLabel(sunday)}`;
  document.getElementById('popup-opts').innerHTML = `
    <div style="font-size:11px;color:var(--muted);margin-bottom:6px">צלמים</div>
    ${photographers.map(rowHtml).join('')}
    <div style="font-size:11px;color:var(--muted);margin:10px 0 6px;padding-top:8px;border-top:1px solid var(--line)">מקליטים</div>
    ${recorders.map(rowHtml).join('')}
  `;
  document.getElementById('popup-overlay').classList.add('show');
}

/* ===================== צילום הטבלה כתמונה ===================== */
async function screenshotTable(){
  const wasEdit = editMode;
  if(wasEdit){
    editMode = false;
    render();
    await new Promise(r=>setTimeout(r, 60)); // לתת ל-DOM להתעדכן לתצוגה הנקייה
  }
  const wrap = document.getElementById('content');
  if(!wrap || !wrap.innerHTML.trim()){
    if(wasEdit){ editMode = true; render(); }
    alert('אין מה לצלם בטאב הזה.');
    return;
  }
  const btn = document.getElementById('screenshot-btn');
  const originalText = btn.textContent;
  btn.textContent = '📷 מכין תמונה...';
  btn.disabled = true;
  // אם יש בתוך הטאב תיבת טבלה עם גלילה פנימית (כמו בסידור השבועי) - מרחיבים אותה זמנית כדי לצלם הכל, לא רק את מה שנראה בגלילה
  const innerScrolls = wrap.querySelectorAll('.table-scroll');
  innerScrolls.forEach(el=>el.classList.add('capture-mode'));
  const currentTab = TABS.find(t=>t.id===activeTab);
  const fileLabel = currentTab ? currentTab.label : 'תצוגה';
  try{
    const canvas = await html2canvas(wrap, {backgroundColor:'#ffffff', scale:2, useCORS:true});
    innerScrolls.forEach(el=>el.classList.remove('capture-mode'));
    if(wasEdit){ editMode = true; render(); }
    canvas.toBlob(async (blob)=>{
      let copied = false;
      try{
        if(navigator.clipboard && window.ClipboardItem){
          await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
          copied = true;
        }
      }catch(e){ console.warn('clipboard image copy failed', e); }
      if(copied){
        alert('התמונה הועתקה! אפשר להדביק במייל/וואטסאפ.');
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `${fileLabel}.png`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(()=>URL.revokeObjectURL(url), 2000);
        alert('התמונה הורדה למכשיר — אפשר לשתף אותה מהגלריה/קבצים.');
      }
      const liveBtn = document.getElementById('screenshot-btn');
      if(liveBtn){ liveBtn.textContent = originalText; liveBtn.disabled = false; }
    });
  } catch(e){
    console.error(e);
    innerScrolls.forEach(el=>el.classList.remove('capture-mode'));
    if(wasEdit){ editMode = true; render(); }
    alert('משהו השתבש בצילום. נסה שוב.');
    const liveBtn = document.getElementById('screenshot-btn');
    if(liveBtn){ liveBtn.textContent = originalText; liveBtn.disabled = false; }
  }
}

/* ===================== סנכרון בזמן אמת ===================== */
let realtimeChannel = null;
let refreshDebounce = null;
function debouncedRefresh(){
  clearTimeout(refreshDebounce);
  refreshDebounce = setTimeout(()=>{ refreshAll().catch(e=>console.error(e)); }, 400);
}
function setupRealtime(){
  if(realtimeChannel) sb.removeChannel(realtimeChannel);
  realtimeChannel = sb.channel('schedule-live')
    .on('postgres_changes', {event:'*', schema:'public', table:'shifts'}, debouncedRefresh)
    .on('postgres_changes', {event:'*', schema:'public', table:'magazine_teams'}, debouncedRefresh)
    .on('postgres_changes', {event:'*', schema:'public', table:'topline_notes'}, debouncedRefresh)
    .on('postgres_changes', {event:'*', schema:'public', table:'mivtzaim_notes'}, debouncedRefresh)
    .on('postgres_changes', {event:'*', schema:'public', table:'vacation_requests'}, debouncedRefresh)
    .on('postgres_changes', {event:'*', schema:'public', table:'workers'}, debouncedRefresh)
    .subscribe();
}

/* ===================== שער כניסה (מייל ארגוני) ===================== */
const MANAGER_ACCESS_EMAILS = ['shlomoa@kan.org.il'];
async function checkTeamAccess(){
  if(localStorage.getItem('team_access_granted')==='yes'){
    // תיקון אוטומטי חד-פעמי: אם המייל השמור שייך למנהל אבל התפקיד עוד לא עודכן (התחברות מלפני התכונה הזו) - נעדכן בשקט
    const savedEmail = (localStorage.getItem('team_access_email')||'').toLowerCase();
    if(MANAGER_ACCESS_EMAILS.includes(savedEmail) && localStorage.getItem('access_role') !== 'manager'){
      localStorage.setItem('access_role', 'manager');
      accessRole = 'manager';
    }
    document.getElementById('access-gate').style.display = 'none';
    document.getElementById('app-wrap').style.display = '';
    loadWeek();
    setupRealtime();
  } else {
    document.getElementById('access-code-input').focus();
  }
}
let pendingAccess = null;
async function submitTeamAccessEmail(){
  const val = document.getElementById('access-code-input').value.trim().toLowerCase();
  if(!val){ return; }
  document.getElementById('access-error').style.display = 'none';
  let allowed = MANAGER_ACCESS_EMAILS.includes(val);
  let role = allowed ? 'manager' : 'full';
  let personalCode = allowed ? ADMIN_PASSWORD : null;
  if(!allowed){
    try{
      const {data} = await sb.from('workers').select('id,email,active,personal_code').ilike('email', val);
      const match = (data||[]).find(w=>w.active && w.email && w.email.toLowerCase()===val);
      if(match){ allowed = true; personalCode = match.personal_code || null; }
    }catch(e){ console.error('access check failed', e); }
  }
  if(!allowed){
    try{
      const {data} = await sb.from('viewers').select('id,email,active,personal_code').ilike('email', val);
      const match = (data||[]).find(w=>w.active && w.email && w.email.toLowerCase()===val);
      if(match){ allowed = true; role = 'producer'; personalCode = match.personal_code || null; }
    }catch(e){ console.error('viewer access check failed', e); }
  }
  if(!allowed){
    document.getElementById('access-error').textContent = 'המייל לא מזוהה. פנה למנהל.';
    document.getElementById('access-error').style.display = 'block';
    return;
  }
  if(personalCode){
    pendingAccess = {email: val, role, code: personalCode};
    document.getElementById('access-step-email').style.display = 'none';
    document.getElementById('access-step-pin').style.display = '';
    document.getElementById('access-pin-input').focus();
  } else {
    finishTeamAccess(val, role);
  }
}
function submitTeamAccessPin(){
  const pin = document.getElementById('access-pin-input').value.trim();
  if(!pendingAccess) return;
  if(pin !== pendingAccess.code){
    document.getElementById('access-error').textContent = 'קוד שגוי.';
    document.getElementById('access-error').style.display = 'block';
    return;
  }
  finishTeamAccess(pendingAccess.email, pendingAccess.role);
  pendingAccess = null;
}
function finishTeamAccess(email, role){
  localStorage.setItem('team_access_granted', 'yes');
  localStorage.setItem('team_access_email', email);
  localStorage.setItem('access_role', role);
  accessRole = role;
  document.getElementById('access-gate').style.display = 'none';
  document.getElementById('app-wrap').style.display = '';
  loadWeek();
  setupRealtime();
}
/* ===================== בדיקת גרסה חדשה (מונע תקיעות על גרסה ישנה שמורה במטמון) ===================== */
let pendingReload = false;
async function checkForNewVersion(){
  try{
    const res = await fetch(location.pathname + '?_=' + Date.now(), {cache:'no-store'});
    const text = await res.text();
    const m = text.match(/const APP_VERSION = '([^']+)'/);
    if(m && m[1] !== APP_VERSION){
      pendingReload = true;
      // מרעננים אך ורק כשהמסך לא פעיל כרגע (המשתמש לא נמצא בו בפועל) - כדי שלעולם לא נפריע לעבודה באמצע
      if(document.visibilityState === 'hidden'){
        location.reload();
      }
    }
  }catch(e){ /* ללא אינטרנט וכו' - מתעלמים */ }
}
setInterval(checkForNewVersion, 2*60*1000);
syncServerTime();
setInterval(syncServerTime, 5*60*1000);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden' && pendingReload){ location.reload(); return; }
  if(document.visibilityState==='visible') checkForNewVersion();
});
checkForNewVersion();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

checkTeamAccess();
