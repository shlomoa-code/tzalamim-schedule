<title>סידור עבודה — צלמים ומקליטים</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{
  --blue:#1A6FBF; --blue-bg:#E6F1FB;
  --green:#0F6E56; --green-bg:#E1F5EE;
  --amber:#C47A00; --amber-bg:#FAEEDA;
  --red:#A32D2D; --red-bg:#FCEBEB;
  --ink:#1F2430; --muted:#6B7280; --line:#E4E4E7; --bg:#FAFAF9;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);padding:16px;font-size:14px}
.wrap{max-width:1400px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px}
h1{font-size:19px;font-weight:600}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.btn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13px;color:var(--ink);transition:.15s}
.btn:hover{background:#F2F2F0}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-primary:hover{background:#155a99}
.btn-danger{background:#fff;color:var(--red);border-color:#E8B4B4}
.btn-danger:hover{background:var(--red-bg)}
.btn-sm{padding:4px 9px;font-size:12px;border-radius:6px}
.week-nav{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.week-label{font-size:13px;font-weight:600;min-width:150px;text-align:center;direction:ltr}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tab{padding:9px 14px;font-size:13px;color:var(--muted);cursor:pointer;background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.sync-badge{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.dot-status{width:7px;height:7px;border-radius:50%;background:#22c55e;display:inline-block}
.dot-status.err{background:var(--red)}

.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
@media(max-width:1000px){.days-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:640px){.days-grid{grid-template-columns:repeat(2,1fr)}}
.day-col{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px;min-height:80px}
.day-head{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.day-head .dnum{color:var(--muted);font-weight:400;font-size:11px;direction:ltr}
.shift-card{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;position:relative}
.shift-time{font-size:11px;color:var(--muted);display:flex;gap:4px;align-items:center;margin-bottom:5px;direction:ltr;justify-content:flex-end}
.shift-time input{border:1px solid transparent;background:transparent;font-size:11px;color:var(--muted);width:44px;text-align:center;border-radius:4px;padding:1px}
.shift-time input:hover{border-color:var(--line)}
.shift-label{font-size:11px;font-weight:600;color:var(--ink);border:1px solid transparent;background:transparent;width:100%;border-radius:4px;margin-bottom:5px}
.label-note{color:var(--amber);font-weight:700}
.shift-label:hover,.shift-label:focus{border-color:var(--line);outline:none}
.worker-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:20px;font-size:12.5px;font-weight:500;cursor:pointer;width:100%;justify-content:center}
.worker-pill.empty{background:#fff;border:1px dashed var(--line);color:var(--muted)}
.worker-pill.filled{background:var(--blue-bg);color:var(--blue)}
.worker-pill.freelance{background:var(--red-bg);color:var(--red)}
.del-row{position:absolute;top:5px;left:5px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;opacity:.5;padding:2px}
.del-row:hover{opacity:1;color:var(--red)}
.sick-badge{display:flex;align-items:center;justify-content:space-between;background:#F1E6FB;color:#6D28D9;border-radius:6px;padding:4px 7px;font-size:11px;font-weight:600;margin-bottom:5px}
.sick-badge button{background:none;border:none;color:#6D28D9;cursor:pointer;font-size:12px;opacity:.7}
.sick-badge button:hover{opacity:1}
.freelance-input{width:100%;border:1px dashed var(--line);background:#fff;border-radius:6px;padding:5px 7px;font-size:11px;margin-top:5px}
.mark-sick-btn{width:100%;margin-top:5px;font-size:11px;padding:4px}
.add-shift-btn{width:100%;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:7px;font-size:12px;color:var(--muted);cursor:pointer}
.add-shift-btn:hover{background:#fff;color:var(--blue);border-color:var(--blue)}

.section-divider{height:1px;background:var(--line);margin:24px 0}
.mag-section-title-main{font-size:17px;font-weight:700;margin-bottom:14px}
.mag-section{margin-bottom:26px}

.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.table-scroll.capture-mode{overflow:visible!important;width:max-content!important;max-width:none!important;border-radius:0}
.master-table{width:100%;border-collapse:collapse;font-size:12px;background:#fff}
.master-table th,.master-table td{border:1px solid var(--line);padding:5px;vertical-align:top}
.master-table thead th{background:#F5F5F3;text-align:center;font-size:12px;padding:7px 5px;white-space:nowrap}
.master-table thead th .dnum{display:block;color:var(--muted);font-weight:400;font-size:10.5px;direction:ltr}
.row-label-col{min-width:110px;background:#F5F5F3}
.master-table td.row-label{background:#FAFAF9;font-weight:700;font-size:11.5px;text-align:right;white-space:nowrap;position:sticky;right:0}
.master-table th.row-label-col{position:sticky;right:0;z-index:3}
.day-cell{min-width:120px}
.section-start td{border-top:2.5px solid var(--ink)}
.row-oncall td.day-cell{background:#EAF6FB}
.row-oncall td.row-label{background:#DCF0F8}
.row-mag-a td.day-cell{background:#FDF1E4}
.row-mag-a td.row-label{background:#FBE6CE}
.row-mag-b td.day-cell{background:#EEF6EA}
.row-mag-b td.row-label{background:#DFEFD8}
.row-mag-c td.day-cell{background:#FBEEF3}
.row-mag-c td.row-label{background:#F6DEE8}
.row-mag-d td.day-cell{background:#EEEEF9}
.row-mag-d td.row-label{background:#DEDEF3}
.row-topline td.day-cell{background:#FFF8EC}
.row-topline td.row-label{background:#FBEFD4}
.row-mivtzaim td.day-cell{background:#EEF5FC}
.row-mivtzaim td.row-label{background:#DCEAF9}

.mobile-day-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.mobile-day-head{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;gap:8px;align-items:baseline}
.mobile-day-head .dnum{font-weight:400;color:var(--muted);font-size:12px;direction:ltr}
.mobile-section{border-radius:8px;padding:8px;margin-bottom:8px;background:var(--bg)}
.mobile-section.row-oncall{background:#EAF6FB}
.mobile-section.row-mag-a{background:#FDF1E4}
.mobile-section.row-mag-b{background:#EEF6EA}
.mobile-section.row-mag-c{background:#FBEEF3}
.mobile-section.row-mag-d{background:#EEEEF9}
.mobile-section.row-topline{background:#FFF8EC}
.mobile-section.row-mivtzaim{background:#EEF5FC}
.mobile-section-label{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px}
.mobile-section-content .mini-card{margin-bottom:5px}
.mobile-section-content .mini-card:last-child{margin-bottom:0}

.my-shifts-box{background:#fff;border:2px solid var(--blue);border-radius:12px;padding:14px;margin-bottom:16px}
.my-shifts-title{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--blue)}
.my-shifts-list{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.my-shift-card{background:var(--blue-bg);border-radius:8px;padding:9px 12px}
.my-shift-day{font-weight:700;font-size:13px;margin-bottom:3px}
.my-shift-detail{font-size:12px;color:var(--ink)}

@media(max-width:700px){
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:8px}
  .master-table{table-layout:auto}
  .master-table th,.master-table td{padding:4px 3px}
  .row-label-col{min-width:70px;position:sticky;right:0;z-index:3;background:#F5F5F3}
  .master-table td.row-label{font-size:10px;white-space:nowrap;position:sticky;right:0;padding:4px 5px}
  .master-table th.row-label-col{position:sticky;right:0}
  .master-table thead th{font-size:10.5px;padding:5px 4px}
  .master-table thead th .dnum{font-size:9px}
  .day-cell{min-width:78px}
  .mini-card{padding:3px 4px;margin-bottom:3px;font-size:10px;border-radius:5px}
  .mini-card .shift-label,.mini-card .team-role,.tap-hint{display:none}
  .mini-card .shift-time{font-size:9px;margin-bottom:2px;justify-content:center}
  .mini-card .worker-pill{font-size:11px;font-weight:700;padding:3px 5px;white-space:nowrap;direction:rtl;text-align:center;border-radius:8px}
  .add-shift-btn{font-size:9px;padding:3px}
  .sick-badge{font-size:9px;padding:2px 4px}
  .topbar{gap:5px}
  .btn{padding:5px 8px;font-size:11px}
}
.mini-card{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 6px;margin-bottom:4px;font-size:11px}
.mini-card.clickable{cursor:pointer;transition:.12s}
.mini-card.clickable:hover{border-color:var(--blue);background:var(--blue-bg)}
.tap-hint{font-size:9px;color:var(--muted);text-align:center;margin-top:2px}
.mini-card .shift-label{font-size:10.5px;margin-bottom:2px}
.mini-card .shift-time{font-size:10px;margin-bottom:3px}
.mini-card .worker-pill{font-size:11px;padding:3px 6px}
.mini-card .team-role{font-size:9px}
.mini-card input{font-size:10px;padding:2px 4px;margin-bottom:3px}
.topline-cell{min-height:30px}
.topline-cell.has-content{background:var(--amber-bg)}
.mivtzaim-cell.has-content{background:var(--bg-accent, #E6F1FB)}
.absence-summary{display:flex;gap:20px;margin-top:16px;flex-wrap:wrap}
.absence-col{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:220px;flex:1}
.absence-col h4{font-size:13px;margin-bottom:8px}
.absence-row{font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line)}
.absence-row:last-child{border-bottom:none}
.mag-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mag-title{font-size:15px;font-weight:700}
.mag-quota{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 10px}
.mag-quota.over{color:var(--red);border-color:#E8B4B4;background:var(--red-bg)}
.team-card{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;position:relative;font-size:11.5px}
.team-card .worker-pill{margin-bottom:4px;font-size:12px;padding:4px 8px}
.team-card input{width:100%;border:1px solid transparent;background:#fff;border-radius:4px;padding:3px 5px;font-size:11px;margin-bottom:4px}
.team-card input:hover,.team-card input:focus{border-color:var(--line);outline:none}
.team-card input::placeholder{color:#B8B8B0}
.team-role{color:var(--muted);font-size:10px;margin-bottom:1px;display:block}

.topline-note{width:100%;min-height:60px;border:1px solid var(--line);border-radius:6px;padding:6px;font-size:12px;resize:vertical}

.workers-list{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.wgroup h3{font-size:13px;margin-bottom:8px;color:var(--muted)}
.wchip{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.wchip.inactive{opacity:.45}
.add-worker-row{display:flex;gap:6px;margin-top:10px}
.add-worker-row input{flex:1;padding:7px;border:1px solid var(--line);border-radius:6px;font-size:13px}

.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:50}
.popup-overlay.show{display:flex}
.popup{background:#fff;border-radius:12px;padding:16px;width:300px;max-height:70vh;overflow:auto}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:6px 9px;border-radius:6px;font-size:13px;margin-bottom:2px}
.stat-row.zero{background:var(--red-bg);color:var(--red);font-weight:600}
.stat-count{font-weight:700;background:var(--bg);border-radius:12px;padding:1px 9px;font-size:12px}
.stat-row.zero .stat-count{background:#fff}
.popup h4{font-size:14px;margin-bottom:10px}
.popup-opt{padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;margin-bottom:3px}
.popup-opt:hover{background:var(--bg)}
.popup-opt.clear{color:var(--red)}
.badge-editmode{background:var(--green-bg);color:var(--green);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600}
.empty-msg{color:var(--muted);font-size:12px;text-align:center;padding:20px}

.worker-select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;margin-bottom:16px;min-width:200px}
.constraint-days{display:flex;gap:8px;flex-wrap:wrap}
.constraint-pill{padding:14px 10px;border-radius:10px;text-align:center;min-width:90px;cursor:pointer;border:1px solid var(--line);font-size:13px;font-weight:600}
.constraint-pill.avail{background:var(--green-bg);color:var(--green);border-color:#9FDBC4}
.constraint-pill.blocked{background:var(--red-bg);color:var(--red);border-color:#E8B4B4}
.constraint-pill.prefer-am{background:#E6F1FB;color:#1A6FBF;border-color:#9CC5EE}
.constraint-pill.must-am{background:#1A6FBF;color:#fff;border-color:#1A6FBF}
.constraint-pill.prefer-pm{background:var(--amber-bg);color:var(--amber);border-color:#EFC98A}
.constraint-pill.must-pm{background:#C47A00;color:#fff;border-color:#C47A00}
.constraint-pill.sick{background:#F1E6FB;color:#6D28D9;border-color:#C9A8ED}
.constraint-pill .cdate{display:block;font-weight:400;font-size:10px;margin-top:3px;opacity:.75}
.overview-cell{text-align:center;font-size:10px;font-weight:600;min-width:70px}
.overview-cell.avail{background:#fff;color:var(--muted)}
.overview-cell.blocked{background:var(--red-bg);color:var(--red)}
.overview-cell.prefer-am{background:#E6F1FB;color:#1A6FBF}
.overview-cell.must-am{background:#1A6FBF;color:#fff}
.overview-cell.prefer-pm{background:var(--amber-bg);color:var(--amber)}
.overview-cell.must-pm{background:#C47A00;color:#fff}
.overview-cell.sick{background:#F1E6FB;color:#6D28D9}

.vac-form{display:flex;gap:10px;flex-wrap:wrap;align-items:end;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:20px}
.vac-form .field{display:flex;flex-direction:column;gap:4px}
.vac-form label{font-size:11px;color:var(--muted)}
.vac-form input,.vac-form select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:13px}
.vac-item{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.vac-status{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600}
.vac-status.pending{background:var(--amber-bg);color:var(--amber)}
.vac-status.approved{background:var(--green-bg);color:var(--green)}
.vac-status.rejected{background:var(--red-bg);color:var(--red)}

.cal-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dayname{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding-bottom:4px}
.cal-cell{border:1px solid var(--line);border-radius:8px;min-height:70px;padding:5px;background:#fff}
.cal-cell.empty-cal{border:none;background:transparent}
.cal-cell.today{border:2px solid var(--blue)}
.cal-daynum{font-size:11px;color:var(--muted);margin-bottom:3px}
.vac-tag-cal{border-radius:4px;font-size:10px;font-weight:700;padding:2px 5px;margin-bottom:2px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>

  let h=0; for(const c of workerId) h = (h*31 + c.charCodeAt(0)) >>> 0;

function dateStr(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function getWeekStart(offset){
  const now = new Date();
  const day = now.getDay(); // 0=Sun
  const sunday = new Date(now); sunday.setDate(now.getDate()-day+offset*7);
  sunday.setHours(0,0,0,0);
  return sunday;
}
function fmtWeekLabel(sunday){
  const sat = new Date(sunday); sat.setDate(sunday.getDate()+6);
  const f = d => `${d.getDate()}/${d.getMonth()+1}`;
  return `${f(sunday)} — ${f(sat)}`;
}
function dateForDay(dayIndex){
  const d = new Date(weekStart); d.setDate(d.getDate()+dayIndex);

}

async function ensureWeekInitialized(){
  const existingShifts = await sb.from('shifts').select('id').eq('week_start', weekStart).limit(1);
  if(!existingShifts.data || existingShifts.data.length===0){
    const rows = [];
    for(const [key,region] of Object.entries(REGIONS)){
      region.weekdayDays.forEach(dayIdx=>{
        region.weekday.forEach((tpl,idx)=>{
          rows.push({week_start:weekStart, region:key, day_of_week:dayIdx, label:tpl.label, start_time:tpl.start, end_time:tpl.end, worker_id:null, row_order:idx});
        });
      });
      region.weekendDays.forEach(dayIdx=>{
        region.weekend.forEach((tpl,idx)=>{
          rows.push({week_start:weekStart, region:key, day_of_week:dayIdx, label:tpl.label, start_time:tpl.start, end_time:tpl.end, worker_id:null, row_order:idx});
        });
      });
    }
    if(rows.length) await sb.from('shifts').insert(rows);
  }

  const existingTeams = await sb.from('magazine_teams').select('id').eq('week_start', weekStart).limit(1);
  if(!existingTeams.data || existingTeams.data.length===0){
    const rows = [];
    for(const [key,mag] of Object.entries(MAGAZINES)){
      mag.days.forEach(dayIdx=>{
        for(let i=0;i<mag.perDay;i++){
          rows.push({week_start:weekStart, magazine:key, day_of_week:dayIdx, photographer_id:null, recorder_id:null, reporter_name:'', topic:'', area:'', start_time:'', end_time:'', row_order:i});
        }
      });
    }
    if(rows.length) await sb.from('magazine_teams').insert(rows);
  }

  await ensureOncallInitialized();
}

async function ensureOncallInitialized(){
  const existing = await sb.from('shifts').select('id,region,day_of_week').eq('week_start', weekStart).eq('label','כונן');
  const have = new Set((existing.data||[]).map(r=>`${r.region}-${r.day_of_week}`));
  const rows = [];
  for(const [region,cfg] of Object.entries(ONCALL)){
    cfg.days.forEach(dayIdx=>{
      if(!have.has(`${region}-${dayIdx}`)){
        rows.push({week_start:weekStart, region, day_of_week:dayIdx, label:'כונן', start_time:cfg.start, end_time:cfg.end, worker_id:null, row_order:99});
      }
    });
  }
  if(rows.length) await sb.from('shifts').insert(rows);
}

function toggleEdit(){
  if(!editMode){
    const pw = prompt('סיסמת מנהל:');
    if(pw !== ADMIN_PASSWORD){ if(pw!==null) alert('סיסמה שגויה'); return; }
    editMode = true;
  } else {
    editMode = false;
  }
  document.getElementById('edit-toggle').textContent = editMode ? '🔓 מצב עריכה פעיל' : '🔒 ערוך';
  document.getElementById('edit-toggle').className = editMode ? 'btn badge-editmode' : 'btn';

  document.getElementById('screenshot-btn').style.display = editMode ? '' : 'none';

}

function buildTabs(){
  const el = document.getElementById('tabs');
  const visibleTabs = TABS.filter(t=> t.kind!=='workers' || editMode);
  el.innerHTML = visibleTabs.map(t=>`<button class="tab ${t.id===activeTab?'active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`).join('');
}
function switchTab(id){ activeTab = id; render(); }

/* ===================== רינדור ראשי ===================== */
function render(){
  buildTabs();
  const tab = TABS.find(t=>t.id===activeTab);
  const el = document.getElementById('content');
  if(tab.kind==='fullschedule') el.innerHTML = renderMasterTable();
  else if(tab.kind==='workers') el.innerHTML = renderWorkers();
  else if(tab.kind==='constraints') el.innerHTML = renderConstraints();
  else if(tab.kind==='vacations') el.innerHTML = renderVacations();
  else if(tab.kind==='calendar') el.innerHTML = renderCalendar();
}

}
function regionCellInner(region, day, filterFn){

function magazineCellInner(magazine, day){

function noteCellInner(notesArr, day, updateFn, placeholder){
  const n = notesArr.find(x=>x.day_of_week===day);
  const has = n && n.note;
  if(editMode){
    return `<textarea class="topline-note" placeholder="${placeholder}" onchange="${updateFn}(${day},'${n?n.id:''}',this.value)">${n?n.note:''}</textarea>`;
  }
  return has ? n.note : '';
}
function noteCell(notesArr, day, cellClass, tableName, updateFn, placeholder){
  const n = notesArr.find(x=>x.day_of_week===day);
  const has = n && n.note;
  const inner = noteCellInner(notesArr, day, updateFn, placeholder);
  return `<td class="day-cell ${cellClass}${has?' has-content':''}">${inner}</td>`;
}
function renderAbsenceSummary(){
  const sunday = getWeekStart(weekOffset);
  const weekStartStr = dateStr(sunday);
  const sat = new Date(sunday); sat.setDate(sunday.getDate()+6);
  const weekEndStr = dateStr(sat);

  const sickEntries = [];
  shifts.forEach(s=>{
    if(s.sick_worker_id){ sickEntries.push({name:workerName(s.sick_worker_id), day:DAYS[s.day_of_week].label, context:s.label}); }
    if(s.sick_recorder_id){ sickEntries.push({name:workerName(s.sick_recorder_id), day:DAYS[s.day_of_week].label, context:s.label}); }
  });
  magTeams.forEach(t=>{
    if(t.sick_photographer_id){ sickEntries.push({name:workerName(t.sick_photographer_id), day:DAYS[t.day_of_week].label, context:MAGAZINES[t.magazine]?.name||t.magazine}); }
    if(t.sick_recorder_id){ sickEntries.push({name:workerName(t.sick_recorder_id), day:DAYS[t.day_of_week].label, context:MAGAZINES[t.magazine]?.name||t.magazine}); }
  });
  // אילוצים שהוצהרו כ"מחלה" לשבוע הבא - מוצגים אוטומטית גם בלי שיבוץ ידני, כשצופים באותו שבוע
  const nextWeekStartStr = dateStr(getWeekStart(1));
  if(weekStartStr === nextWeekStartStr){
    constraintsData.forEach(c=>{
      if(c.status==='sick'){
        const name = workerName(c.worker_id);
        const day = DAYS[c.day_of_week].label;
        const exists = sickEntries.some(e=>e.name===name && e.day===day);
        if(!exists) sickEntries.push({name, day, context:'אילוץ מוצהר'});
      }
    });
  }

  const vacationEntries = vacationRequests.filter(v=>v.status==='approved' && v.from_date<=weekEndStr && v.to_date>=weekStartStr)
    .map(v=>({name:workerName(v.worker_id), from:v.from_date, to:v.to_date}));

  if(!sickEntries.length && !vacationEntries.length) return '';

  let html = `<div class="absence-summary">`;
  if(sickEntries.length){
    html += `<div class="absence-col"><h4>🤒 במחלה השבוע</h4>` +
      sickEntries.map(e=>`<div class="absence-row">${e.name} — ${e.day} (${e.context})</div>`).join('') + `</div>`;
  }
  if(vacationEntries.length){
    html += `<div class="absence-col"><h4>🏖️ בחופש השבוע</h4>` +
      vacationEntries.map(e=>`<div class="absence-row">${e.name} — ${e.from}${e.from!==e.to?' עד '+e.to:''}</div>`).join('') + `</div>`;
  }
  html += `</div>`;
  return html;
}

/* ---------- מצא את המשמרות שלי (תצוגה אישית לנייד) ---------- */
function renderMyShifts(){
  const activeWorkers = workers.filter(w=>w.active).sort((a,b)=>a.name.localeCompare(b.name,'he'));
  let html = `<div class="my-shifts-box">
    <div class="my-shifts-title">📱 מצא את המשמרות שלי</div>
    <select class="worker-select" onchange="selectedMyShiftsWorker=this.value;render()">
      <option value="">— בחר את שמך —</option>
      ${activeWorkers.map(w=>`<option value="${w.id}" ${selectedMyShiftsWorker===w.id?'selected':''}>${w.name}</option>`).join('')}
    </select>`;

  if(selectedMyShiftsWorker){
    const id = selectedMyShiftsWorker;
    const entries = [];
    shifts.forEach(s=>{
      if(s.worker_id===id) entries.push({day:s.day_of_week, cat:REGIONS[s.region]?.name||s.region, label:s.label, time:`${s.start_time}–${s.end_time}`, role:'צלם'});
      if(s.recorder_id===id) entries.push({day:s.day_of_week, cat:REGIONS[s.region]?.name||s.region, label:s.label, time:`${s.start_time}–${s.end_time}`, role:'מקליט'});
    });
    magTeams.forEach(t=>{
      if(t.photographer_id===id) entries.push({day:t.day_of_week, cat:MAGAZINES[t.magazine]?.name||t.magazine, label:t.reporter_name?`כתב: ${t.reporter_name}`:'', time:t.start_time?`${t.start_time}–${t.end_time}`:'', role:'צלם'});
      if(t.recorder_id===id) entries.push({day:t.day_of_week, cat:MAGAZINES[t.magazine]?.name||t.magazine, label:t.reporter_name?`כתב: ${t.reporter_name}`:'', time:t.start_time?`${t.start_time}–${t.end_time}`:'', role:'מקליט'});
    });
    entries.sort((a,b)=>a.day-b.day);
    if(!entries.length){
      html += `<div class="empty-msg">אין לך שיבוצים השבוע</div>`;
    } else {
      html += `<div class="my-shifts-list">` + entries.map(e=>{
        const ds = dateForDay(e.day);
        return `<div class="my-shift-card">
          <div class="my-shift-day">${DAYS[e.day].label} <span style="direction:ltr;color:var(--muted);font-weight:400;font-size:11px">${ds.slice(8,10)}/${ds.slice(5,7)}</span></div>
          <div class="my-shift-detail">${e.cat} — ${e.role}${e.label?' · '+e.label:''}${e.time?' · '+e.time:''}</div>
        </div>`;
      }).join('') + `</div>`;
    }
  }
  html += `</div>`;
  return html;
}

function isMobileView(){ return window.innerWidth <= 700; }
function firstName(name){ return name ? name.split(' ')[0] : name; }
function dispName(name){ return name && isMobileView() ? firstName(name) : name; }

function buildSections(){

  const sections = [];
  const add = (label, inner, sectionStart, rowClass, shortLabel)=> sections.push({label, shortLabel:shortLabel||label, inner, sectionStart, rowClass});

  add('שוטף ת"א', d=>regionCellInner('ta', d, l=>l!=='כונן'), true, null, 'ת"א');
  add('כוננים', d=>regionCellInner('ta', d, l=>l==='כונן'), false, 'row-oncall');
  add('שוטף ירושלים', d=>regionCellInner('jerusalem', d, l=>l!=='כונן'), true, null, 'י-ם');
  add('כוננים', d=>regionCellInner('jerusalem', d, l=>l==='כונן'), false, 'row-oncall');
  if(editMode || hasAnyShiftInRegion('special1')) add('אירוע מיוחד 1', d=>regionCellInner('special1', d, l=>true), true, null, 'אירוע 1');
  if(editMode || hasAnyShiftInRegion('special2')) add('אירוע מיוחד 2', d=>regionCellInner('special2', d, l=>true), false, null, 'אירוע 2');
  add('מגזין מהדורה', d=>magazineCellInner('mahadura', d), true, 'row-mag-a', 'מהדורה');
  add('מגזין ריכוז', d=>magazineCellInner('rikuz', d), false, 'row-mag-b', 'ריכוז');
  add('מגזין שישי', d=>magazineCellInner('friday', d), false, 'row-mag-c', 'שישי');
  add('מגזין שבת', d=>magazineCellInner('saturday', d), false, 'row-mag-d', 'שבת');
  add('דרום — צלם', d=>regionCellInner('south', d, l=>l!=='כונן' && l!=='ערבית'), true, null, 'דרום');
  add('כוננות דרום', d=>regionCellInner('south', d, l=>l==='כונן'), false, 'row-oncall', 'כוננות');
  add('חיפה — צלם', d=>regionCellInner('haifa', d, l=>l!=='כונן' && l!=='ערבית'), true, null, 'חיפה');
  add('כוננות חיפה', d=>regionCellInner('haifa', d, l=>l==='כונן'), false, 'row-oncall', 'כוננות');
  add('ערבית דרום', d=>regionCellInner('south', d, l=>l==='ערבית'), true, null, 'ער\' דרום');
  add('ערבית חיפה', d=>regionCellInner('haifa', d, l=>l==='ערבית'), false, null, 'ער\' חיפה');
  add('טופליין', d=>noteCellInner(toplineNotes, d, 'updateTopline', 'לא פעיל'), true, 'row-topline');
  add('מבצעים', d=>noteCellInner(mivtzaimNotes, d, 'updateMivtzaim', 'לא הוזן'), false, 'row-mivtzaim');
  return sections;
}

function renderDesktopTable(sections){
  const mobile = isMobileView();
  const headerCells = DAYS.map(d=>{
    const ds = dateForDay(d.i);
    const dayLabel = mobile ? DAYS_SHORT[d.i] : d.label;
    return `<th>${dayLabel}<span class="dnum">${ds.slice(8,10)}/${ds.slice(5,7)}</span></th>`;
  }).join('');
  const rowsHtml = sections.map(sec=>{
    const cells = DAYS.map(d=>`<td class="day-cell">${sec.inner(d.i)}</td>`).join('');
    const classes = [sec.sectionStart?'section-start':'', sec.rowClass||''].filter(Boolean).join(' ');
    const label = mobile ? sec.shortLabel : sec.label;
    return `<tr${classes?` class="${classes}"`:''}><td class="row-label">${label}</td>${cells}</tr>`;
  }).join('');
  return `<div class="table-scroll"><table class="master-table">
    <thead><tr><th class="row-label-col"></th>${headerCells}</tr></thead>
    <tbody>${rowsHtml}</tbody>
  </table></div>`;
}

function renderMobileDays(sections){
  let html = '';
  DAYS.forEach(day=>{
    const ds = dateForDay(day.i);
    const parts = sections.map(sec=>{
      const inner = sec.inner(day.i);
      if(!inner || !inner.trim()) return '';
      return `<div class="mobile-section ${sec.rowClass||''}">
        <div class="mobile-section-label">${sec.label}</div>
        <div class="mobile-section-content">${inner}</div>
      </div>`;
    }).filter(Boolean).join('');
    if(!parts && !editMode) return; // דלג על ימים ריקים לגמרי בתצוגת צפייה
    html += `<div class="mobile-day-card">
      <div class="mobile-day-head">${day.label} <span class="dnum">${ds.slice(8,10)}/${ds.slice(5,7)}</span></div>
      ${parts || '<div class="empty-msg">אין שיבוצים ביום זה</div>'}
    </div>`;
  });
  return html;
}

function renderMasterTable(){
  const sunday = getWeekStart(weekOffset);
  const sections = buildSections();
  const body = renderDesktopTable(sections);

  return `<div class="sub" style="margin-bottom:10px">שבוע: ${fmtWeekLabel(sunday)}</div>
  ${renderMyShifts()}
  ${body}
  ${renderAbsenceSummary()}`;
}

/* ---------- אזור שוטף ---------- */
function renderRegion(regionKey){
  const region = REGIONS[regionKey];
  let html = `<div class="days-grid">`;
  DAYS.forEach(day=>{
    const isWeekend = day.i===5 || day.i===6;
    if(isWeekend && !region.weekendDays.includes(day.i) && !shifts.some(s=>s.region===regionKey && s.day_of_week===day.i)){
      html += `<div class="day-col"><div class="day-head">${day.label}<span class="dnum">${dateForDay(day.i).slice(8,10)}/${dateForDay(day.i).slice(5,7)}</span></div>`;
      if(editMode) html += `<button class="add-shift-btn" onclick="addShift('${regionKey}',${day.i})">+ הוסף משמרת</button>`;
      else html += `<div class="empty-msg">אין משמרת</div>`;
      html += `</div>`;
      return;
    }
    const dayShifts = shifts.filter(s=>s.region===regionKey && s.day_of_week===day.i).sort((a,b)=>a.row_order-b.row_order);
    html += `<div class="day-col"><div class="day-head">${day.label}<span class="dnum">${dateForDay(day.i).slice(8,10)}/${dateForDay(day.i).slice(5,7)}</span></div>`;
    dayShifts.forEach(s=>{
      const wname = workerName(s.worker_id);
      const displayName = s.freelance_name ? `${s.freelance_name} (פרילנס)` : wname;
      const sickName = s.sick_worker_id ? workerName(s.sick_worker_id) : null;
      html += `<div class="shift-card">
        ${editMode?`<button class="del-row" onclick="deleteShift('${s.id}')">✕</button>`:''}
        ${editMode
          ? `<input class="shift-label" value="${s.label}" onchange="updateShift('${s.id}','label',this.value)">
             <div class="shift-time">
               <input value="${s.start_time}" onchange="updateShift('${s.id}','start_time',this.value)">–
               <input value="${s.end_time}" onchange="updateShift('${s.id}','end_time',this.value)">
             </div>`
          : `<div class="shift-label">${s.label}</div><div class="shift-time">${s.start_time}–${s.end_time}</div>`
        }
        ${sickName?`<div class="sick-badge">🤒 מחלה: ${sickName}${editMode?`<button onclick="clearSick('${s.id}')">✕ בטל</button>`:''}</div>`:''}
        <div class="worker-pill ${displayName?'filled':'empty'}" ${editMode?`onclick="openWorkerPopup('shift','${s.id}','photographer')"`:''}>${displayName||(sickName?'+ שבץ מחליף':'+ שבץ צלם')}</div>
        ${editMode?`<input class="freelance-input" placeholder="או הקלד שם פרילנס" value="${s.freelance_name||''}" onchange="updateShift('${s.id}','freelance_name',this.value)">`:''}
        ${editMode && s.worker_id && !sickName ? `<button class="btn btn-sm btn-danger mark-sick-btn" onclick="markSick('${s.id}')">🤒 סמן מחלה</button>` : ''}
      </div>`;
    });
    if(editMode) html += `<button class="add-shift-btn" onclick="addShift('${regionKey}',${day.i})">+ הוסף משמרת</button>`;
    html += `</div>`;
  });
  html += `</div>`;
  return `<div class="mag-head"><div class="mag-title">${region.name}</div></div>` + html;
}

async function addShift(region, day){
  const label = prompt('שם המשמרת:', 'משמרת חדשה');
  if(label===null) return;
  const start = prompt('שעת התחלה:', '09:00') || '';
  const end = prompt('שעת סיום:', '18:00') || '';
  const maxOrder = Math.max(0, ...shifts.filter(s=>s.region===region && s.day_of_week===day).map(s=>s.row_order+1), 0);
  const {data} = await sb.from('shifts').insert({week_start:weekStart, region, day_of_week:day, label, start_time:start, end_time:end, worker_id:null, row_order:maxOrder}).select();
  if(data) shifts.push(data[0]);
  render();
}
async function deleteShift(id){
  if(!confirm('למחוק את המשמרת?')) return;
  await sb.from('shifts').delete().eq('id',id);
  shifts = shifts.filter(s=>s.id!==id);
  render();
}
async function updateShift(id, field, value){
  await sb.from('shifts').update({[field]:value}).eq('id',id);
  const s = shifts.find(x=>x.id===id); if(s) s[field]=value;
}
async function markSick(id){
  const s = shifts.find(x=>x.id===id);
  if(!s || !s.worker_id) return;
  const sickId = s.worker_id;
  await sb.from('shifts').update({sick_worker_id:sickId, worker_id:null}).eq('id',id);
  s.sick_worker_id = sickId; s.worker_id = null;
  render();
}
async function clearSick(id){
  await sb.from('shifts').update({sick_worker_id:null}).eq('id',id);
  const s = shifts.find(x=>x.id===id); if(s) s.sick_worker_id=null;
  render();
}
async function markShiftSick(id, role){
  const s = shifts.find(x=>x.id===id);
  if(!s) return;
  if(role==='photographer'){
    if(!s.worker_id) return;
    await sb.from('shifts').update({sick_worker_id:s.worker_id, worker_id:null}).eq('id',id);
    s.sick_worker_id = s.worker_id; s.worker_id = null;
  } else {
    if(!s.recorder_id) return;
    await sb.from('shifts').update({sick_recorder_id:s.recorder_id, recorder_id:null}).eq('id',id);
    s.sick_recorder_id = s.recorder_id; s.recorder_id = null;
  }
  render();
}
async function clearShiftSick(id, role){
  const field = role==='photographer' ? 'sick_worker_id' : 'sick_recorder_id';
  await sb.from('shifts').update({[field]:null}).eq('id',id);
  const s = shifts.find(x=>x.id===id); if(s) s[field]=null;
  render();
}

async function updateTopline(day, id, value){

      html += `<textarea class="topline-note" placeholder="לדוגמה: גל (בוקר), תוג'אן (ערב)" onchange="updateMivtzaim(${day.i},'${note?note.id:''}',this.value)">${note?note.note:''}</textarea>`;
    } else {
      html += note && note.note ? `<div class="shift-card">${note.note}</div>` : `<div class="empty-msg">לא הוזן</div>`;
    }
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}
async function updateMivtzaim(day, id, value){
  if(id){
    await sb.from('mivtzaim_notes').update({note:value}).eq('id',id);
    const n = mivtzaimNotes.find(x=>x.id===id); if(n) n.note=value;
  } else {
    const {data} = await sb.from('mivtzaim_notes').insert({week_start:weekStart, day_of_week:day, note:value}).select();
    if(data) mivtzaimNotes.push(data[0]);
  }
}

async function addFreelancer(type){
  const inputId = type==='photographer' ? 'new-free-photog' : 'new-free-recorder';
  const input = document.getElementById(inputId);
  const name = input.value.trim();
  if(!name) return;
  const {data} = await sb.from('freelancers').insert({name, type, active:true}).select();
  if(data) freelancers.push(data[0]);
  input.value='';
  render();
}
async function deleteFreelancer(id){
  if(!confirm('למחוק את הפרילנס?')) return;
  await sb.from('freelancers').delete().eq('id',id);
  freelancers = freelancers.filter(f=>f.id!==id);
  render();
}
async function addWorker(type){
  const inputId = type==='photographer' ? 'new-photog' : 'new-recorder';
  const emailId = type==='photographer' ? 'new-photog-email' : 'new-recorder-email';
  const input = document.getElementById(inputId);
  const emailInput = document.getElementById(emailId);
  const name = input.value.trim();
  const email = emailInput.value.trim();
  if(!name) return;
  const {data} = await sb.from('workers').insert({name, email, type, active:true}).select();
  if(data) workers.push(data[0]);
  input.value=''; emailInput.value='';
  render();
}
async function toggleWorkerActive(id, active){
  await sb.from('workers').update({active}).eq('id',id);
  const w = workers.find(x=>x.id===id); if(w) w.active=active;
  render();
}
async function editWorker(id){
  const w = workers.find(x=>x.id===id);
  if(!w) return;
  const newName = prompt('שם:', w.name);
  if(newName===null) return;
  const newEmail = prompt('מייל (אפשר להשאיר ריק):', w.email||'');
  if(newEmail===null) return;
  const name = newName.trim() || w.name;
  const email = newEmail.trim();
  await sb.from('workers').update({name, email}).eq('id',id);
  w.name = name; w.email = email;
  render();
}
async function deleteWorker(id){
  if(!confirm('למחוק את העובד? (שיבוצים קיימים ישארו אך יוצגו כריקים)')) return;
  await sb.from('workers').delete().eq('id',id);
  workers = workers.filter(w=>w.id!==id);
  render();
}

async function pickWorker(workerId){

    if(role==='recorder'){
      await sb.from('shifts').update({recorder_id:workerId, freelance_recorder_name:''}).eq('id',id);
      const s = shifts.find(x=>x.id===id); if(s){ s.recorder_id=workerId; s.freelance_recorder_name=''; }
    } else {
      await sb.from('shifts').update({worker_id:workerId, freelance_name:''}).eq('id',id);
      const s = shifts.find(x=>x.id===id); if(s){ s.worker_id=workerId; s.freelance_name=''; }
    }
  } else {
    const field = role==='photographer' ? 'photographer_id' : 'recorder_id';
    const freeField = role==='photographer' ? 'freelance_photographer_name' : 'freelance_recorder_name';
    await sb.from('magazine_teams').update({[field]:workerId, [freeField]:''}).eq('id',id);
    const t = magTeams.find(x=>x.id===id); if(t){ t[field]=workerId; t[freeField]=''; }
  }
  closePopup();
  render();

async function pickFreelancer(name){
  if(!popupCtx) return;
  const {kind, id, role} = popupCtx;
  if(kind==='shift'){
    if(role==='recorder'){
      await sb.from('shifts').update({freelance_recorder_name:name, recorder_id:null}).eq('id',id);

    const field = role==='photographer' ? 'photographer_id' : 'recorder_id';
    const freeField = role==='photographer' ? 'freelance_photographer_name' : 'freelance_recorder_name';
    await sb.from('magazine_teams').update({[freeField]:name, [field]:null}).eq('id',id);

  'סלבה קנייזן':'ta','ירון סודרי':'ta','רוליק נביצקי':'ta','אורון גולן':'ta','מיכה ריזוב':'ta','מיכה לויט':'ta',

  'גל שני':'haifa'
};
function renderConstraintsOverview(){
  const nextSunday = getWeekStart(1);
  const activeWorkers = workers.filter(w=>w.active);
  const groupOrder = [
    {key:'ta', label:'צלמי ת"א', type:'photographer'},
    {key:'jerusalem', label:'צלמי ירושלים', type:'photographer'},
    {key:'south', label:'צלמי דרום', type:'photographer'},
    {key:'haifa', label:'צלמי חיפה', type:'photographer'},
    {key:'ta', label:'מקליטי ת"א', type:'recorder'},
    {key:'jerusalem', label:'מקליטי ירושלים', type:'recorder'},
    {key:'haifa', label:'מקליטי חיפה', type:'recorder'}
  ];
  const rowHtml = w=>{
    let cells = '';
    DAYS.forEach(day=>{
      const row = constraintsData.find(c=>c.worker_id===w.id && c.day_of_week===day.i);
      const status = row ? (row.status||'available') : 'available';
      const note = row ? (row.note||'') : '';
      const st = CONSTRAINT_STATUSES.find(s=>s.id===status) || CONSTRAINT_STATUSES[0];
      const shortLabel = status==='available' ? '' : st.label;
      cells += `<td class="day-cell overview-cell ${st.cls}">${shortLabel}${note?`<br><span style="font-weight:400">${note}</span>`:''}</td>`;
    });
    return `<tr><td class="row-label">${w.name}</td>${cells}</tr>`;
  };

  let bodyRows = '';
  const usedIds = new Set();
  groupOrder.forEach(g=>{
    const groupWorkers = activeWorkers.filter(w=>w.type===g.type && WORKER_REGION[w.name]===g.key);
    if(!groupWorkers.length) return;
    groupWorkers.forEach(w=>usedIds.add(w.id));
    bodyRows += `<tr><td class="row-label" colspan="8" style="background:#EFEFEC;text-align:right">${g.label}</td></tr>`;
    bodyRows += groupWorkers.map(rowHtml).join('');
  });
  const leftover = activeWorkers.filter(w=>!usedIds.has(w.id));
  if(leftover.length){
    bodyRows += `<tr><td class="row-label" colspan="8" style="background:#EFEFEC;text-align:right">אחר</td></tr>`;
    bodyRows += leftover.map(rowHtml).join('');

  let html = `<h3 style="margin:22px 0 10px;font-size:14px">סקירה — כל העובדים</h3>
  <div class="table-scroll"><table class="master-table">
    <thead><tr><th class="row-label-col">עובד</th>${DAYS.map(d=>{
      const dd = new Date(nextSunday); dd.setDate(dd.getDate()+d.i);

      return `<th>${d.label}<span class="dnum">${ds.slice(8,10)}/${ds.slice(5,7)}</span></th>`;
    }).join('')}</tr></thead>
    <tbody>${bodyRows}</tbody>
  </table></div>`;
  return html;
}
let constraintPopupDay = null;
function openConstraintPopup(day){
  constraintPopupDay = day;
  document.getElementById('popup-title').textContent = 'בחר סטטוס ליום';
  document.getElementById('popup-opts').innerHTML = CONSTRAINT_STATUSES.map(s=>`<div class="popup-opt" onclick="pickConstraintStatus('${s.id}')">${s.label}</div>`).join('');
  document.getElementById('popup-overlay').classList.add('show');
}
async function pickConstraintStatus(status){
  const nextWeekStart = dateStr(getWeekStart(1));
  const day = constraintPopupDay;
  const existing = constraintsData.find(c=>c.worker_id===selectedConstraintWorker && c.day_of_week===day);
  let note = existing ? (existing.note||'') : '';
  const wantsNote = status!=='available' && status!=='blocked';
  if(wantsNote){
    const entered = prompt('שעות מועדפות (לא חובה, למשל 10:00-18:00):', note);
    if(entered!==null) note = entered.trim();
  } else if(status==='blocked' || status==='sick'){
    note = '';
  }
  if(existing){
    await sb.from('constraints').update({status, note, available: status!=='blocked'}).eq('id',existing.id);
    existing.status = status; existing.note = note; existing.available = status!=='blocked';
  } else {
    const {data} = await sb.from('constraints').insert({week_start:nextWeekStart, worker_id:selectedConstraintWorker, day_of_week:day, status, note, available: status!=='blocked'}).select();
    if(data) constraintsData.push(data[0]);
  }
  closePopup();
  render();
}

async function submitVacation(){
  const worker_id = document.getElementById('vac-worker').value;
  const from_date = document.getElementById('vac-from').value;
  const to_date = document.getElementById('vac-to').value || from_date;
  const note = document.getElementById('vac-note').value;

  const {data} = await sb.from('vacation_requests').insert({worker_id, from_date, to_date, note, status:'pending'}).select();
  if(data) vacationRequests.push(data[0]);
  sendVacationRequestEmail(workerName(worker_id), from_date, to_date, note);
  render();
}
async function setVacStatus(id, status){
  await sb.from('vacation_requests').update({status}).eq('id',id);
  const v = vacationRequests.find(x=>x.id===id); if(v) v.status=status;
  if(v){
    const w = workers.find(x=>x.id===v.worker_id);
    if(w) sendVacationResponseEmail(w.email, w.name, status, v.from_date, v.to_date);
  }
  render();
}

/* ---------- לוח חופשות ---------- */
function renderCalendar(){
  const dayNames = ['א','ב','ג','ד','ה','ו','ש'];
  let html = `<div class="cal-nav">
    <button class="btn btn-sm" onclick="changeMonth(-1)">◀</button>
    <div style="font-weight:600;font-size:14px;min-width:120px;text-align:center">${MONTHS_HE[calMonth]} ${calYear}</div>
    <button class="btn btn-sm" onclick="changeMonth(1)">▶</button>
  </div>
  <div class="cal-grid">${dayNames.map(d=>`<div class="cal-dayname">${d}</div>`).join('')}`;
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const todayStr = dateStr(new Date());
  for(let i=0;i<firstDay;i++) html += `<div class="cal-cell empty-cal"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = ds===todayStr;
    const approved = vacationRequests.filter(v=>v.status==='approved' && ds>=v.from_date && ds<=v.to_date);
    const tags = approved.map(v=>`<div class="vac-tag-cal" style="background:${colorFor(v.worker_id)}">${workerName(v.worker_id)||'—'}</div>`).join('');
    html += `<div class="cal-cell ${isToday?'today':''}"><div class="cal-daynum">${d}</div>${tags}</div>`;
  }
  html += `</div>`;
  return html;
}
function changeMonth(delta){
  calMonth += delta;
  if(calMonth<0){ calMonth=11; calYear--; }
  if(calMonth>11){ calMonth=0; calYear++; }
  render();
}

/* ===================== העתקת סידור לטקסט ===================== */
function copyScheduleText(){
  const sunday = getWeekStart(weekOffset);
  let out = `סידור עבודה — צלמים ומקליטים\nשבוע: ${fmtWeekLabel(sunday)}\n`;

  for(const [key,region] of Object.entries(REGIONS)){
    out += `\n=== ${region.name} ===\n`;
    DAYS.forEach(day=>{
      const dayShifts = shifts.filter(s=>s.region===key && s.day_of_week===day.i).sort((a,b)=>a.row_order-b.row_order);
      if(!dayShifts.length) return;
      out += `${day.label} (${dateForDay(day.i).slice(8,10)}/${dateForDay(day.i).slice(5,7)}):\n`;
      dayShifts.forEach(s=>{
        const name = s.freelance_name ? `${s.freelance_name} (פרילנס)` : (workerName(s.worker_id) || '—');
        const sick = s.sick_worker_id ? ` [מחלה: ${workerName(s.sick_worker_id)}]` : '';
        out += `  ${s.label} (${s.start_time}-${s.end_time}): ${name}${sick}\n`;
      });
    });
  }

  out += `\n=== מגזינים ===\n`;
  for(const [key,mag] of Object.entries(MAGAZINES)){
    out += `\n${mag.name}:\n`;
    DAYS.forEach(day=>{
      const teams = magTeams.filter(t=>t.magazine===key && t.day_of_week===day.i).sort((a,b)=>a.row_order-b.row_order);
      const filled = teams.filter(t=>t.photographer_id||t.recorder_id||t.freelance_photographer_name||t.freelance_recorder_name);
      if(!filled.length) return;
      out += `${day.label}:\n`;
      filled.forEach(t=>{
        const p = t.freelance_photographer_name ? `${t.freelance_photographer_name} (פרילנס)` : (workerName(t.photographer_id)||'—');
        const r = t.freelance_recorder_name ? `${t.freelance_recorder_name} (פרילנס)` : (workerName(t.recorder_id)||'—');
        out += `  צלם: ${p} | מקליט: ${r}`;
        if(t.reporter_name) out += ` | כתב: ${t.reporter_name}`;
        if(t.topic) out += ` | נושא: ${t.topic}`;
        if(t.area) out += ` | אזור: ${t.area}`;
        if(t.start_time) out += ` | ${t.start_time}-${t.end_time}`;
        out += `\n`;
      });
    });
  }

  const toplineActive = DAYS.some(d=>toplineNotes.find(n=>n.day_of_week===d.i && n.note));
  if(toplineActive){
    out += `\n=== טופליין — צפון רחוק ===\n`;
    DAYS.forEach(day=>{
      const n = toplineNotes.find(x=>x.day_of_week===day.i);
      if(n && n.note) out += `${day.label}: ${n.note}\n`;
    });
  }

  const mivtzaimActive = DAYS.some(d=>mivtzaimNotes.find(n=>n.day_of_week===d.i && n.note));
  if(mivtzaimActive){
    out += `\n=== מבצעים ===\n`;
    DAYS.forEach(day=>{
      const n = mivtzaimNotes.find(x=>x.day_of_week===day.i);
      if(n && n.note) out += `${day.label}: ${n.note}\n`;
    });
  }

  const doCopy = (text)=>{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>alert('הסידור הועתק! אפשר להדביק במייל.')).catch(()=>fallbackCopy(text));
    } else fallbackCopy(text);
  };
  const fallbackCopy = (text)=>{
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); alert('הסידור הועתק! אפשר להדביק במייל.'); }
    catch(e){ alert('לא הצלחתי להעתיק אוטומטית — הטקסט מוצג בחלון הבא להעתקה ידנית.'); prompt('העתק ידנית (Ctrl+C):', text); }
    document.body.removeChild(ta);
  };
  doCopy(out);
}

/* ===================== סטטיסטיקת שיבוצים ===================== */
function computeWorkerCounts(){
  const counts = {};
  workers.forEach(w=>counts[w.id]=0);
  shifts.forEach(s=>{
    if(s.worker_id && counts[s.worker_id]!==undefined) counts[s.worker_id]++;
    if(s.recorder_id && counts[s.recorder_id]!==undefined) counts[s.recorder_id]++;
  });
  magTeams.forEach(t=>{
    if(t.photographer_id && counts[t.photographer_id]!==undefined) counts[t.photographer_id]++;
    if(t.recorder_id && counts[t.recorder_id]!==undefined) counts[t.recorder_id]++;
  });
  return counts;
}
function showStats(){
  const counts = computeWorkerCounts();

  const photographers = workers.filter(w=>w.type==='photographer' && w.active).sort((a,b)=>counts[a.id]-counts[b.id]);
  const recorders = workers.filter(w=>w.type==='recorder' && w.active).sort((a,b)=>counts[a.id]-counts[b.id]);

  const rowHtml = w=>{
    const c = counts[w.id]||0;
    const zero = c===0;
    return `<div class="stat-row ${zero?'zero':''}">${zero?'⚠️ ':''}${w.name}<span class="stat-count">${c}</span></div>`;
  };

  const sunday = getWeekStart(weekOffset);
  document.getElementById('popup-title').textContent = `שיבוצים — שבוע ${fmtWeekLabel(sunday)}`;
  document.getElementById('popup-opts').innerHTML = `
    <div style="font-size:11px;color:var(--muted);margin-bottom:6px">צלמים</div>
    ${photographers.map(rowHtml).join('')}
    <div style="font-size:11px;color:var(--muted);margin:10px 0 6px;padding-top:8px;border-top:1px solid var(--line)">מקליטים</div>
    ${recorders.map(rowHtml).join('')}
  `;
  document.getElementById('popup-overlay').classList.add('show');
}

/* ===================== צילום הטבלה כתמונה ===================== */
async function screenshotTable(){
  const wasEdit = editMode;
  if(wasEdit){
    editMode = false;
    render();
    await new Promise(r=>setTimeout(r, 60)); // לתת ל-DOM להתעדכן לתצוגה הנקייה
  }
  const wrap = document.querySelector('.table-scroll');
  if(!wrap){
    if(wasEdit){ editMode = true; render(); }
    alert('לא נמצאה טבלה לצילום — ודא שאתה בטאב "סידור שבועי".');
    return;
  }
  const btn = document.getElementById('screenshot-btn');
  const originalText = btn.textContent;
  btn.textContent = '📷 מכין תמונה...';
  btn.disabled = true;
  wrap.classList.add('capture-mode');
  try{
    const canvas = await html2canvas(wrap, {backgroundColor:'#ffffff', scale:2, useCORS:true});
    wrap.classList.remove('capture-mode');
    if(wasEdit){ editMode = true; render(); }
    canvas.toBlob(async (blob)=>{
      let copied = false;
      try{
        if(navigator.clipboard && window.ClipboardItem){
          await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
          copied = true;
        }
      }catch(e){ console.warn('clipboard image copy failed', e); }
      if(copied){
        alert('התמונה הועתקה! אפשר להדביק במייל/וואטסאפ.');
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'סידור-שבועי.png';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(()=>URL.revokeObjectURL(url), 2000);
        alert('התמונה הורדה למכשיר — אפשר לשתף אותה מהגלריה/קבצים.');
      }
      const liveBtn = document.getElementById('screenshot-btn');
      if(liveBtn){ liveBtn.textContent = originalText; liveBtn.disabled = false; }
    });
  } catch(e){
    console.error(e);
    wrap.classList.remove('capture-mode');
    if(wasEdit){ editMode = true; render(); }
    alert('משהו השתבש בצילום הטבלה. נסה שוב.');
    const liveBtn = document.getElementById('screenshot-btn');
    if(liveBtn){ liveBtn.textContent = originalText; liveBtn.disabled = false; }
  }
}

/* ===================== סנכרון בזמן אמת ===================== */
let realtimeChannel = null;
let refreshDebounce = null;
function debouncedRefresh(){
  clearTimeout(refreshDebounce);
  refreshDebounce = setTimeout(()=>{ refreshAll().catch(e=>console.error(e)); }, 400);
}
function setupRealtime(){
  if(realtimeChannel) sb.removeChannel(realtimeChannel);
  realtimeChannel = sb.channel('schedule-live')
    .on('postgres_changes', {event:'*', schema:'public', table:'shifts'}, debouncedRefresh)
    .on('postgres_changes', {event:'*', schema:'public', table:'magazine_teams'}, debouncedRefresh)
    .on('postgres_changes', {event:'*', schema:'public', table:'topline_notes'}, debouncedRefresh)
    .on('postgres_changes', {event:'*', schema:'public', table:'mivtzaim_notes'}, debouncedRefresh)
    .on('postgres_changes', {event:'*', schema:'public', table:'vacation_requests'}, debouncedRefresh)
    .on('postgres_changes', {event:'*', schema:'public', table:'workers'}, debouncedRefresh)
    .subscribe();
}

/* ===================== התחלה ===================== */
let lastIsMobile = isMobileView();
window.addEventListener('resize', ()=>{
  clearTimeout(window._resizeDebounce);
  window._resizeDebounce = setTimeout(()=>{
    const nowMobile = isMobileView();
    if(nowMobile !== lastIsMobile){ lastIsMobile = nowMobile; render(); }
  }, 200);
});
loadWeek();
setupRealtime();
